name: A2 sufficient-budget task-order causal discrimination (development only)

on:
  workflow_dispatch:
    inputs:
      implementation_sha:
        description: Exact merged-main implementation commit to diagnose
        required: true
        type: string
      target_contract_path:
        description: Committed concrete fixed-target contract
        required: true
        default: configs/fixed-cpu-target-1.0.json
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: planning-model-a2-sufficient-budget-task-order-development
  cancel-in-progress: false

jobs:
  a2-sufficient-budget-task-order:
    name: a2-sufficient-budget-task-order-development-only
    if: github.repository == 'egorkogor/Planning-Model'
    runs-on:
      - self-hosted
      - linux
      - x64
      - planning-model-canonical-cpu-v1
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Verify immutable runner identity file
        shell: bash
        run: |
          set -euo pipefail
          test -s /etc/planning-model-runner-image-id || {
            echo "::error::A2_ORDER_RUNNER_IMAGE_ID_MISSING"
            exit 1
          }
          runner_image="$(cat /etc/planning-model-runner-image-id)"
          test -n "$runner_image" || {
            echo "::error::A2_ORDER_RUNNER_IMAGE_ID_EMPTY"
            exit 1
          }
          printf 'FIXED_TARGET_RUNNER_IMAGE=%s\n' "$runner_image" >> "$GITHUB_ENV"

      - name: Checkout protected main for trust validation
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Verify requested implementation is protected and exact
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.implementation_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::A2_ORDER_IMPLEMENTATION_INVALID"
            exit 1
          }
          test "$WORKFLOW_SHA" = "$REQUESTED_SHA" || {
            echo "::error::A2_ORDER_WORKFLOW_IMPLEMENTATION_MISMATCH"
            exit 1
          }
          git fetch --no-tags origin main
          python -m scripts.run_fixed_target_acceptance validate-trusted-commit \
            --implementation-commit "$REQUESTED_SHA" \
            --protected-ref origin/main
          git checkout --detach "$REQUESTED_SHA"
          git reset --hard "$REQUESTED_SHA"
          git clean -ffdqx
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA" || {
            echo "::error::A2_ORDER_IMPLEMENTATION_CHECKOUT_MISMATCH"
            exit 1
          }
          test -z "$(git status --porcelain=v1 --untracked-files=all)" || {
            echo "::error::A2_ORDER_IMPLEMENTATION_DIRTY_TREE"
            exit 1
          }
          printf 'A2_ORDER_IMPLEMENTATION_SHA=%s\n' "$REQUESTED_SHA" >> "$GITHUB_ENV"

      - name: Validate dedicated target observation
        shell: bash
        env:
          CONTRACT_PATH: ${{ inputs.target_contract_path }}
        run: |
          set -euo pipefail
          test "$CONTRACT_PATH" = "configs/fixed-cpu-target-1.0.json" || {
            echo "::error::A2_ORDER_TARGET_CONTRACT_PATH_NOT_CANONICAL"
            exit 1
          }
          test -f "$CONTRACT_PATH" || {
            echo "::error::A2_ORDER_TARGET_CONTRACT_MISSING"
            exit 1
          }
          rm -rf .a2-sufficient-budget-task-order
          mkdir -p .a2-sufficient-budget-task-order
          python -m scripts.run_fixed_target_acceptance preflight \
            --target-contract "$CONTRACT_PATH" \
            --implementation-commit "$A2_ORDER_IMPLEMENTATION_SHA" \
            --protected-ref origin/main \
            --output .a2-sufficient-budget-task-order/target-preflight.json
          test -z "$(git status --porcelain=v1 --untracked-files=no)" || {
            echo "::error::A2_ORDER_DIRTY_TREE_AFTER_PREFLIGHT"
            exit 1
          }

      - name: Run development-only A2 task-order experiment
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat /etc/planning-model-runner-image-id)" = "$FIXED_TARGET_RUNNER_IMAGE" || {
            echo "::error::A2_ORDER_RUNNER_IMAGE_DRIFT"
            exit 1
          }
          python -m scripts.run_a2_sufficient_budget_task_order \
            --output-dir .a2-sufficient-budget-task-order/experiment \
            --implementation-commit "$A2_ORDER_IMPLEMENTATION_SHA"

      - name: Independently validate persisted experiment evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.run_a2_sufficient_budget_task_order \
            --output-dir .a2-sufficient-budget-task-order/experiment \
            --implementation-commit "$A2_ORDER_IMPLEMENTATION_SHA" \
            --validate-only
          test -z "$(git status --porcelain=v1 --untracked-files=no)" || {
            echo "::error::A2_ORDER_IMPLEMENTATION_DIRTY_TREE_AFTER_EXPERIMENT"
            exit 1
          }

      - name: Upload development experiment evidence
        uses: actions/upload-artifact@v4
        with:
          name: a2-sufficient-budget-task-order-development-${{ github.run_id }}
          path: .a2-sufficient-budget-task-order
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true

      - name: Cleanup experiment workspace
        if: always()
        shell: bash
        run: |
          rm -rf .a2-sufficient-budget-task-order .pytest-tmp .pytest_cache
          git reset --hard HEAD
          git clean -ffdx
