name: Apply canonical runtime payload

on:
  push:
    branches:
      - agent/pin-canonical-cpu-execution-identity

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/pin-canonical-cpu-execution-identity
      - name: Reconstruct and verify payload
        run: |
          cat .runtime-pin-payload/part-* | base64 --decode > /tmp/runtime-pin-payload.tar.gz
          echo '4eceaebd0d7eb83b902ed82c72d36697043a648db3f7889ab27e077673e83f64  /tmp/runtime-pin-payload.tar.gz' | sha256sum --check
          tar -xzf /tmp/runtime-pin-payload.tar.gz
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          expected = {
              '.github/workflows/ci.yml': '385aacdd38ebe91963cb5ed6295e8ad6f969fc7514f13dd62fa0e5c0bd5f0193',
              'planner_toy/canonical_runtime.py': '8253fba89cb69dbb029e381d8b60870e77d8ead3a66c9c26e79bc202c7c5f80e',
              'planner_toy/schemas/toy_quality_evaluation.schema.json': 'd77c7ec5002a1f6b1d2dc269d4e05e31459e77a8ffb80f225f51ac73ae4d1c0c',
              'release/BOOTSTRAP_MANIFEST.json': '9a09ba67e053f0812215a4fa3078851e780fb7ca4ff88ed7620bca44ed8a49b1',
              'tests/toy/test_canonical_runtime.py': 'a0f5e90ecf848a47bf4f592db4229a5ad20fbc328db76cca251b8cbc58ba2da2',
              'docs/evaluations/CANONICAL_CPU_EXECUTION_IDENTITY_INVESTIGATION_RU.md': '0496f7a6a286de32337c1413e0000fc23b489d16c681024102875c216a9b167f',
              'scripts/run_canonical_training_probe.py': 'a2e714ff4883f69bd89d8b6946f6e8adb5d8d467886a9efb12528ba8ebf4c684',
              'tests/toy/test_canonical_training_probe.py': 'e1fd714aa987f2f5a5bf4a908cfe61b013b8b22e7bf9ffaba785b08f6f01acff',
          }
          for path, digest in expected.items():
              observed = sha256(Path(path).read_bytes()).hexdigest()
              if observed != digest:
                  raise SystemExit(f'{path}: expected {digest}, observed {observed}')
          print(f'PAYLOAD_VERIFIED files={len(expected)}')
          PY
      - name: Publish atomic implementation commit
        run: |
          rm -rf .runtime-pin-payload
          rm -f .github/workflows/apply-runtime-pin-payload.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Pin canonical CPU execution identity across hosts'
          git push origin HEAD:agent/pin-canonical-cpu-execution-identity
