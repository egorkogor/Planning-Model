name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    timeout-minutes: 45
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e . --no-deps
      - run: python validation/verify_release_manifest.py
      - run: python validation/validate_bundle.py --skip-nested-pytest
      - run: python validation/run_test_suite.py --timeout-per-file 120
      - run: ruff check .
      - name: Verify tests left a clean checkout
        run: |
          rm -rf .pytest-tmp .pytest_cache
          git diff --exit-code
          test -z "$(git status --porcelain)"
