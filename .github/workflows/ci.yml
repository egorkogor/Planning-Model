name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    timeout-minutes: 45
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e . --no-deps
      - run: python -m pip install torch==2.12.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[ml]'
      - name: PyTorch runtime diagnostics
        run: |
          python - <<'PY'
          import torch
          print(torch.__version__)
          print(torch.version.cuda)
          print(torch.cuda.is_available())
          PY
      - run: python validation/verify_release_manifest.py
      - run: python validation/validate_bundle.py --skip-nested-pytest
      - name: Run complete per-file suite
        run: |
          python validation/run_test_suite.py --timeout-per-file 120 --log-dir .pytest-tmp/logs || {
            find .pytest-tmp/logs -type f -name '*.log' -print -exec cat {} \;
            exit 1
          }
      - run: ruff check .
      - name: Pin canonical diagnostic Python
        if: matrix.python-version == '3.11'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: pip
      - name: Install canonical diagnostic runtime
        if: matrix.python-version == '3.11'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
          python -m pip install torch==2.12.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[ml]'
      - name: Verify same-host historical diagnostic reproducibility (non-acceptance)
        if: matrix.python-version == '3.11'
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          IMPLEMENTATION_SHA="$(python - <<'PY'
          import json
          from pathlib import Path
          path = Path('docs/evaluations/data/a2_a3_a4_heldout_summary.json')
          if not path.is_file():
              raise SystemExit('committed compact diagnostic is missing')
          print(json.loads(path.read_text())['implementation_commit'])
          PY
          )"
          test -n "$IMPLEMENTATION_SHA"
          if ! git cat-file -e "${IMPLEMENTATION_SHA}^{commit}" 2>/dev/null; then
            if test "$(git rev-parse --is-shallow-repository)" = true; then
              echo "implementation commit is unavailable because checkout history is shallow" >&2
            else
              echo "implementation commit is absent from the fetched repository" >&2
            fi
            exit 1
          fi
          if ! git merge-base --is-ancestor "$IMPLEMENTATION_SHA" HEAD; then
            echo "implementation commit exists but is not an ancestor of the results checkout" >&2
            exit 1
          fi
          if ! git show "$IMPLEMENTATION_SHA:requirements.lock" >/dev/null; then
            echo "implementation tree is incomplete: requirements.lock is missing" >&2
            exit 1
          fi
          RUN_CANONICAL_QUALITY_DETERMINISM=1 \
          QUALITY_IMPLEMENTATION_COMMIT="$IMPLEMENTATION_SHA" \
            python -m pytest -q -m canonical_quality \
            tests/toy/test_quality_determinism.py
          python -m scripts.run_toy_quality_evaluation \
            --output-dir .quality-eval-ci \
            --implementation-commit "$IMPLEMENTATION_SHA"
          python -m scripts.run_toy_quality_evaluation \
            --output-dir .quality-eval-ci --validate-only \
            --compact-dir .quality-docs-ci
          python -m scripts.run_toy_quality_evaluation \
            --output-dir .quality-eval-ci-independent \
            --implementation-commit "$IMPLEMENTATION_SHA"
          python -m scripts.run_toy_quality_evaluation \
            --output-dir .quality-eval-ci-independent --validate-only \
            --compact-dir .quality-docs-ci-independent
          for artifact in \
            evaluation-config.json replay-hash.txt task-results.jsonl \
            per-seed-summary.json aggregate-summary.json paired-comparisons.json \
            human-readable-examples.md; do
            cmp ".quality-eval-ci/$artifact" ".quality-eval-ci-independent/$artifact"
          done
          cmp .quality-docs-ci/data/a2_a3_a4_heldout_summary.json \
            .quality-docs-ci-independent/data/a2_a3_a4_heldout_summary.json
          cmp .quality-docs-ci/A2_A3_A4_HELDOUT_DIAGNOSTIC_RU.md \
            .quality-docs-ci-independent/A2_A3_A4_HELDOUT_DIAGNOSTIC_RU.md
          rm -rf .quality-eval-ci .quality-docs-ci \
            .quality-eval-ci-independent .quality-docs-ci-independent
      - name: Verify tests left a clean checkout
        run: |
          rm -rf .pytest-tmp .pytest_cache
          git diff --exit-code
          test -z "$(git status --porcelain)"

  canonical-workers:
    name: canonical-run-${{ matrix.worker }}
    strategy:
      matrix:
        worker: [a, b]
    runs-on: ubuntu-latest
    env:
      IMPLEMENTATION_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: pip
      - run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
          python -m pip install torch==2.12.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[ml]'
      - name: Independent canonical run
        run: |
          printf '%s\n' "$IMPLEMENTATION_SHA" > implementation-sha.txt
          python -m scripts.run_toy_quality_evaluation \
            --output-dir canonical-run --implementation-commit "$IMPLEMENTATION_SHA"
          python -m scripts.run_toy_quality_evaluation \
            --output-dir canonical-run --validate-only --compact-dir compact
          cp implementation-sha.txt canonical-run/
          cp -R compact canonical-run/compact
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-${{ matrix.worker }}
          path: canonical-run

  canonical-compare:
    needs: canonical-workers
    runs-on: ubuntu-latest
    env:
      IMPLEMENTATION_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
      - name: Install pinned canonical comparison runtime
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
          python -m pip install torch==2.12.0+cpu \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[ml]'
      - uses: actions/download-artifact@v4
        with:
          name: canonical-a
          path: a
      - uses: actions/download-artifact@v4
        with:
          name: canonical-b
          path: b
      - name: Generate hosted cross-worker diagnostic report
        run: |
          cmp a/implementation-sha.txt b/implementation-sha.txt
          printf '%s\n' "$IMPLEMENTATION_SHA" | cmp - a/implementation-sha.txt
          for path in \
            canonical-semantic-payload.json \
            task-results-semantic.json \
            replay-hash.txt \
            per-seed-summary.json \
            aggregate-summary.json \
            paired-comparisons.json \
            compact/data/a2_a3_a4_heldout_summary.json \
            compact/A2_A3_A4_HELDOUT_DIAGNOSTIC_RU.md; do
            test -f "a/$path"
            test -f "b/$path"
          done
          python -m scripts.compare_toy_quality_runs \
            a b --output cross-worker-report.json
      - name: Report hosted cross-worker observation (non-acceptance)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("cross-worker-report.json")
          if not path.is_file():
              raise SystemExit("HOSTED_CROSS_WORKER_REPORT_MISSING")
          report = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(report, dict):
              raise SystemExit("HOSTED_CROSS_WORKER_REPORT_MALFORMED")

          required_types = {
              "canonical_numeric_policy": dict,
              "json_differences": dict,
              "text_differences": dict,
              "numeric_differences": list,
              "raw_serialization_differences": list,
          }
          for key, expected_type in required_types.items():
              if not isinstance(report.get(key), expected_type):
                  raise SystemExit(f"HOSTED_CROSS_WORKER_REPORT_MALFORMED:{key}")
          for key in ("observed_max_abs", "observed_max_rel"):
              value = report.get(key)
              if isinstance(value, bool) or not isinstance(value, (int, float)) or value < 0:
                  raise SystemExit(f"HOSTED_CROSS_WORKER_REPORT_MALFORMED:{key}")
          for key in ("first_numeric_difference", "first_json_difference"):
              value = report.get(key)
              if value is not None and not isinstance(value, dict):
                  raise SystemExit(f"HOSTED_CROSS_WORKER_REPORT_MALFORMED:{key}")

          differences_observed = any(
              report[key]
              for key in (
                  "json_differences",
                  "text_differences",
                  "numeric_differences",
                  "raw_serialization_differences",
              )
          )
          if differences_observed:
              print("::warning::HOSTED_CROSS_WORKER_DIFFERENCE_OBSERVED_NON_ACCEPTANCE")
              print("HOSTED_CROSS_WORKER_DIFFERENCE_OBSERVED_NON_ACCEPTANCE")
          else:
              print("HOSTED_CROSS_WORKER_MATCH")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-cross-worker-diagnostic
          path: cross-worker-report.json
