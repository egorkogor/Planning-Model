name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    timeout-minutes: 45
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e . --no-deps
      - run: python -m pip install torch==2.12.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[ml]'
      - name: PyTorch runtime diagnostics
        run: |
          python - <<'PY'
          import torch
          print(torch.__version__)
          print(torch.version.cuda)
          print(torch.cuda.is_available())
          PY
      - run: python validation/verify_release_manifest.py
      - run: python validation/validate_bundle.py --skip-nested-pytest
      - name: Run complete per-file suite
        run: |
          python validation/run_test_suite.py --timeout-per-file 120 --log-dir .pytest-tmp/logs || {
            find .pytest-tmp/logs -type f -name '*.log' -print -exec cat {} \;
            exit 1
          }
      - run: ruff check .
      - name: Regenerate canonical quality diagnostic
        if: matrix.python-version == '3.11'
        run: |
          IMPLEMENTATION_SHA="$(python - <<'PY'
          import json
          from pathlib import Path
          path = Path('docs/evaluations/data/a2_a3_a4_heldout_summary.json')
          if not path.is_file():
              raise SystemExit('committed compact diagnostic is missing')
          print(json.loads(path.read_text())['implementation_commit'])
          PY
          )"
          test -n "$IMPLEMENTATION_SHA"
          python -m scripts.run_toy_quality_evaluation \
            --output-dir .quality-eval-ci \
            --implementation-commit "$IMPLEMENTATION_SHA"
          python -m scripts.run_toy_quality_evaluation \
            --output-dir .quality-eval-ci --validate-only \
            --compact-dir .quality-docs-ci
          cmp .quality-docs-ci/data/a2_a3_a4_heldout_summary.json \
            docs/evaluations/data/a2_a3_a4_heldout_summary.json
          cmp .quality-docs-ci/A2_A3_A4_HELDOUT_DIAGNOSTIC_RU.md \
            docs/evaluations/A2_A3_A4_HELDOUT_DIAGNOSTIC_RU.md
          rm -rf .quality-eval-ci .quality-docs-ci
      - name: Verify tests left a clean checkout
        run: |
          rm -rf .pytest-tmp .pytest_cache
          git diff --exit-code
          test -z "$(git status --porcelain)"
