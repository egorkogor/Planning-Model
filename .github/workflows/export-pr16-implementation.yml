name: Export PR16 implementation

on:
  push:
    branches:
      - agent/a2-end-learnability-diagnostics
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Decode implementation payload
        shell: bash
        run: |
          set -euo pipefail
          cat .pr16-parts/part-00 .pr16-parts/part-01 \
            .pr16-parts/part-02 .pr16-parts/part-03 \
            | base64 --decode > /tmp/pr16-changes.tar.xz
          printf '%s  %s\n' \
            '6e2112583c3569ccb4d6c835c97baf5d7ab820105b7e24cda9578bb97349514e' \
            '/tmp/pr16-changes.tar.xz' | sha256sum --check --strict
          mkdir -p /tmp/pr16-implementation
          tar -xJf /tmp/pr16-changes.tar.xz -C /tmp/pr16-implementation
          tar -czf /tmp/pr16-implementation.tar.gz \
            -C /tmp/pr16-implementation \
            planner_toy/learnability.py \
            planner_toy/learnability_diagnostic.schema.json \
            scripts/run_toy_learnability_diagnostic.py \
            tests/toy/test_learnability_diagnostic.py \
            docs/evaluations/A2_END_COLLAPSE_DIAGNOSTIC_SPEC_RU.md
      - uses: actions/upload-artifact@v4
        with:
          name: pr16-implementation
          path: /tmp/pr16-implementation.tar.gz
          retention-days: 1
