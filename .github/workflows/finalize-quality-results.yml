name: Finalize quality results

on:
  push:
    branches:
      - codex/add-held-out-quality-evaluation-for-a2-a3-a4-z8gy96

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      IMPLEMENTATION_SHA: 779172c3bbca3d03552deaed6421e82fcf19a932
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/add-held-out-quality-evaluation-for-a2-a3-a4-z8gy96
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: pip
      - name: Install pinned runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
          python -m pip install torch==2.12.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[ml]'
      - name: Regenerate and validate committed results
        run: |
          git cat-file -e "${IMPLEMENTATION_SHA}^{commit}"
          git merge-base --is-ancestor "$IMPLEMENTATION_SHA" HEAD
          python -m scripts.run_toy_quality_evaluation \
            --output-dir .quality-eval-final \
            --implementation-commit "$IMPLEMENTATION_SHA"
          python -m scripts.run_toy_quality_evaluation \
            --output-dir .quality-eval-final \
            --validate-only \
            --compact-dir .quality-docs-final
          cp .quality-docs-final/data/a2_a3_a4_heldout_summary.json \
            docs/evaluations/data/a2_a3_a4_heldout_summary.json
          cp .quality-docs-final/A2_A3_A4_HELDOUT_DIAGNOSTIC_RU.md \
            docs/evaluations/A2_A3_A4_HELDOUT_DIAGNOSTIC_RU.md
          rm -rf .quality-eval-final .quality-docs-final
          rm .github/workflows/finalize-quality-results.yml
          python scripts/build_release_manifest.py
          python validation/verify_release_manifest.py
          python validation/validate_bundle.py --skip-nested-pytest
          ruff check .
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evaluations/A2_A3_A4_HELDOUT_DIAGNOSTIC_RU.md \
            docs/evaluations/data/a2_a3_a4_heldout_summary.json \
            release/BOOTSTRAP_MANIFEST.json \
            .github/workflows/finalize-quality-results.yml
          git commit -m "Regenerate canonical quality results"
          git push origin HEAD:codex/add-held-out-quality-evaluation-for-a2-a3-a4-z8gy96
