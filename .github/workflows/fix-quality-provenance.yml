name: One-time quality provenance repair

on:
  pull_request:
    paths:
      - .github/workflows/fix-quality-provenance.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'codex/add-held-out-quality-evaluation-for-a2-a3-a4-x9se58'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e . --no-deps
      - run: python -m pip install torch==2.12.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[ml]'
      - name: Regenerate canonical artifacts
        env:
          IMPLEMENTATION_SHA: 9ac8fc8b6206fdc47a0d633c24654a8326a0d1e7
        run: |
          rm -rf .quality-eval .quality-eval-independent .quality-docs-independent
          python -m scripts.run_toy_quality_evaluation \
            --output-dir .quality-eval \
            --implementation-commit "$IMPLEMENTATION_SHA"
          python -m scripts.run_toy_quality_evaluation \
            --output-dir .quality-eval \
            --validate-only \
            --compact-dir docs/evaluations
          python -m scripts.run_toy_quality_evaluation \
            --output-dir .quality-eval-independent \
            --implementation-commit "$IMPLEMENTATION_SHA"
          python -m scripts.run_toy_quality_evaluation \
            --output-dir .quality-eval-independent \
            --validate-only \
            --compact-dir .quality-docs-independent
          cmp docs/evaluations/data/a2_a3_a4_heldout_summary.json \
            .quality-docs-independent/data/a2_a3_a4_heldout_summary.json
          cmp docs/evaluations/A2_A3_A4_HELDOUT_DIAGNOSTIC_RU.md \
            .quality-docs-independent/A2_A3_A4_HELDOUT_DIAGNOSTIC_RU.md
          rm -rf .quality-eval .quality-eval-independent .quality-docs-independent
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            docs/evaluations/A2_A3_A4_HELDOUT_DIAGNOSTIC_RU.md \
            docs/evaluations/data/a2_a3_a4_heldout_summary.json | sort)"
      - name: Commit repaired artifacts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/evaluations/A2_A3_A4_HELDOUT_DIAGNOSTIC_RU.md \
            docs/evaluations/data/a2_a3_a4_heldout_summary.json
          git commit -m "docs: bind diagnostic to reachable implementation commit"
          git push origin HEAD:refs/heads/${{ github.head_ref }}
