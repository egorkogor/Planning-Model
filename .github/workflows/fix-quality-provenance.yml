name: One-time quality provenance repair

on:
  pull_request:
    paths:
      - .github/workflows/fix-quality-provenance.yml

permissions:
  contents: read

jobs:
  repair:
    if: github.head_ref == 'codex/add-held-out-quality-evaluation-for-a2-a3-a4-x9se58'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e . --no-deps
      - run: python -m pip install torch==2.12.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[ml]'
      - name: Regenerate canonical artifacts
        env:
          IMPLEMENTATION_SHA: 9ac8fc8b6206fdc47a0d633c24654a8326a0d1e7
        run: |
          rm -rf .quality-eval .quality-eval-independent .quality-docs-independent repaired-artifacts
          python -m scripts.run_toy_quality_evaluation \
            --output-dir .quality-eval \
            --implementation-commit "$IMPLEMENTATION_SHA"
          python -m scripts.run_toy_quality_evaluation \
            --output-dir .quality-eval \
            --validate-only \
            --compact-dir repaired-artifacts
          python -m scripts.run_toy_quality_evaluation \
            --output-dir .quality-eval-independent \
            --implementation-commit "$IMPLEMENTATION_SHA"
          python -m scripts.run_toy_quality_evaluation \
            --output-dir .quality-eval-independent \
            --validate-only \
            --compact-dir .quality-docs-independent
          cmp repaired-artifacts/data/a2_a3_a4_heldout_summary.json \
            .quality-docs-independent/data/a2_a3_a4_heldout_summary.json
          cmp repaired-artifacts/A2_A3_A4_HELDOUT_DIAGNOSTIC_RU.md \
            .quality-docs-independent/A2_A3_A4_HELDOUT_DIAGNOSTIC_RU.md
      - uses: actions/upload-artifact@v4
        with:
          name: repaired-quality-provenance
          path: repaired-artifacts
          if-no-files-found: error
          retention-days: 1
