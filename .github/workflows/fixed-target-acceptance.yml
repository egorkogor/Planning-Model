name: Fixed target runtime 1.1 formal acceptance

on:
  workflow_dispatch:
    inputs:
      implementation_sha:
        description: Exact protected-main implementation commit to execute
        required: true
        type: string
      target_contract_path:
        description: Committed concrete fixed-target contract
        required: true
        default: configs/fixed-cpu-target-1.0.json
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: planning-model-fixed-target-formal-acceptance
  cancel-in-progress: false

jobs:
  fixed-target-acceptance:
    name: fixed-target-acceptance
    if: github.repository == 'egorkogor/Planning-Model'
    runs-on:
      - self-hosted
      - linux
      - x64
      - planning-model-canonical-cpu-v1
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Verify immutable runner identity file
        shell: bash
        run: |
          set -euo pipefail
          test -s /etc/planning-model-runner-image-id || {
            echo "::error::FIXED_TARGET_TRUSTED_RUNNER_IMAGE_ID_MISSING"
            exit 1
          }
          runner_image="$(cat /etc/planning-model-runner-image-id)"
          test -n "$runner_image" || {
            echo "::error::FIXED_TARGET_TRUSTED_RUNNER_IMAGE_ID_EMPTY"
            exit 1
          }
          printf 'FIXED_TARGET_RUNNER_IMAGE=%s\n' "$runner_image" >> "$GITHUB_ENV"

      - name: Checkout protected main for trust validation
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Verify requested execution commit is protected and exact
        id: trust
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.implementation_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::FIXED_TARGET_IMPLEMENTATION_INVALID"
            exit 1
          }
          test "$WORKFLOW_SHA" = "$REQUESTED_SHA" || {
            echo "::error::FIXED_TARGET_WORKFLOW_IMPLEMENTATION_MISMATCH"
            exit 1
          }
          test "$RUN_ATTEMPT" = "1" || {
            echo "::error::FIXED_TARGET_WORKFLOW_RERUN_FORBIDDEN"
            exit 1
          }
          git fetch --no-tags origin main
          git cat-file -e "${REQUESTED_SHA}^{commit}" || {
            echo "::error::FIXED_TARGET_IMPLEMENTATION_COMMIT_MISSING"
            exit 1
          }
          git merge-base --is-ancestor "$REQUESTED_SHA" origin/main || {
            echo "::error::FIXED_TARGET_IMPLEMENTATION_NOT_ON_PROTECTED_MAIN"
            exit 1
          }
          git checkout --detach "$REQUESTED_SHA"
          git reset --hard "$REQUESTED_SHA"
          git clean -ffdqx
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA" || {
            echo "::error::FIXED_TARGET_IMPLEMENTATION_CHECKOUT_MISMATCH"
            exit 1
          }
          test -z "$(git status --porcelain=v1 --untracked-files=all)" || {
            echo "::error::FIXED_TARGET_IMPLEMENTATION_DIRTY_TREE"
            exit 1
          }
          python -m scripts.run_fixed_target_acceptance validate-trusted-commit \
            --implementation-commit "$REQUESTED_SHA" \
            --protected-ref origin/main
          printf 'FIXED_TARGET_IMPLEMENTATION_SHA=%s\n' "$REQUESTED_SHA" >> "$GITHUB_ENV"

      - name: Require committed concrete target contract
        shell: bash
        env:
          CONTRACT_PATH: ${{ inputs.target_contract_path }}
        run: |
          set -euo pipefail
          test "$CONTRACT_PATH" = "configs/fixed-cpu-target-1.0.json" || {
            echo "::error::FIXED_TARGET_CONTRACT_PATH_NOT_CANONICAL"
            exit 1
          }
          git cat-file -e "HEAD:${CONTRACT_PATH}" 2>/dev/null || {
            echo "::error::REAL_FIXED_TARGET_NOT_PROVISIONED: concrete target contract is not committed"
            exit 1
          }
          test -f "$CONTRACT_PATH" || {
            echo "::error::REAL_FIXED_TARGET_NOT_PROVISIONED: concrete target contract is absent"
            exit 1
          }
          test -z "$(git status --porcelain=v1 --untracked-files=all)" || {
            echo "::error::FIXED_TARGET_IMPLEMENTATION_DIRTY_TREE"
            exit 1
          }
          printf 'FIXED_TARGET_CONTRACT_PATH=%s\n' "$CONTRACT_PATH" >> "$GITHUB_ENV"

      - name: Validate target observation before any training
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .fixed-target-formal
          mkdir -p .fixed-target-formal/preflight .fixed-target-formal/bundle
          python -m scripts.run_fixed_target_acceptance preflight \
            --target-contract "$FIXED_TARGET_CONTRACT_PATH" \
            --implementation-commit "$FIXED_TARGET_IMPLEMENTATION_SHA" \
            --protected-ref origin/main \
            --formal \
            --output .fixed-target-formal/preflight/preflight.json
          test -z "$(git status --porcelain=v1 --untracked-files=no)" || {
            echo "::error::FIXED_TARGET_IMPLEMENTATION_DIRTY_TREE_AFTER_PREFLIGHT"
            exit 1
          }

      - name: Resolve immutable GitHub workflow job id
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          RUNNER_NAME_VALUE: ${{ runner.name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          url = (
              f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}"
              f"/actions/runs/{os.environ['GH_RUN_ID']}/jobs?per_page=100"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "planning-model-fixed-target-acceptance",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          candidates = [
              job
              for job in payload.get("jobs", [])
              if job.get("status") == "in_progress"
              and job.get("runner_name") == os.environ["RUNNER_NAME_VALUE"]
              and job.get("name") == "fixed-target-acceptance"
          ]
          if len(candidates) != 1:
              raise SystemExit("FIXED_TARGET_GITHUB_JOB_ID_AMBIGUOUS")
          job_id = candidates[0].get("id")
          if not isinstance(job_id, int) or job_id < 1:
              raise SystemExit("FIXED_TARGET_GITHUB_JOB_ID_INVALID")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write(f"FIXED_TARGET_WORKFLOW_JOB_ID={job_id}\n")
          PY

      - name: Execute three fresh formal attempts
        shell: bash
        run: |
          set -euo pipefail
          work_root=.fixed-target-formal/work
          bundle_root=.fixed-target-formal/bundle
          mkdir -p "$work_root"

          for attempt_index in 1 2 3; do
            test "$(cat /etc/planning-model-runner-image-id)" = "$FIXED_TARGET_RUNNER_IMAGE" || {
              echo "::error::FIXED_TARGET_RUNNER_IMAGE_ID_DRIFT:${attempt_index}"
              exit 1
            }
            attempt_root="$work_root/attempt-${attempt_index}"
            packaged_root="$bundle_root/attempt-${attempt_index}"
            test ! -e "$attempt_root" || {
              echo "::error::FIXED_TARGET_FORMAL_ATTEMPT_REUSE:${attempt_index}"
              exit 1
            }
            test ! -e "$packaged_root" || {
              echo "::error::FIXED_TARGET_FORMAL_PACKAGED_ATTEMPT_REUSE:${attempt_index}"
              exit 1
            }

            python -m scripts.run_fixed_target_quality_evaluation init-attempt \
              --attempt-root "$attempt_root" \
              --target-contract "$FIXED_TARGET_CONTRACT_PATH" \
              --execution-implementation-commit "$FIXED_TARGET_IMPLEMENTATION_SHA" \
              --execution-context formal-fixed-target

            for variant in A2 A3 A4; do
              for seed in 17 29 43; do
                test ! -e "$attempt_root/units/$variant/seed-$seed" || {
                  echo "::error::FIXED_TARGET_FORMAL_UNIT_REUSE:${attempt_index}:${variant}:${seed}"
                  exit 1
                }
                # Each invocation is a new Python process and creates a fresh model,
                # optimizer, checkpoint lineage, and held-out evidence tree.
                python -m scripts.run_fixed_target_quality_evaluation run-unit \
                  --attempt-root "$attempt_root" \
                  --variant "$variant" \
                  --seed "$seed"
              done
            done

            # Formal assembly recursively validates exact 3x3 coverage and every
            # unit's persisted checkpoint, optimizer, training config, held-out
            # evidence, and deterministic runtime/1.1 replay.
            python -m scripts.run_fixed_target_quality_evaluation assemble \
              --attempt-root "$attempt_root"

            python -m scripts.run_fixed_target_acceptance package-formal-attempt \
              --attempt-root "$attempt_root" \
              --destination "$packaged_root" \
              --attempt-index "$attempt_index" \
              --workflow-run-id "$GITHUB_RUN_ID" \
              --job-id "$FIXED_TARGET_WORKFLOW_JOB_ID" \
              --workflow-sha "$FIXED_TARGET_IMPLEMENTATION_SHA"

            # Separate process: validate the sealed packaged attempt from primary
            # artifacts before allowing the next attempt to count.
            python -m scripts.run_fixed_target_acceptance validate-formal-attempt \
              --attempt-root "$packaged_root" \
              --attempt-index "$attempt_index"
          done

      - name: Build formal 3-of-3 acceptance bundle
        shell: bash
        env:
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python -m scripts.run_fixed_target_acceptance build-formal-bundle \
            --bundle-root .fixed-target-formal/bundle \
            --implementation-commit "$FIXED_TARGET_IMPLEMENTATION_SHA" \
            --workflow-run-id "$GH_RUN_ID" \
            --job-id "$FIXED_TARGET_WORKFLOW_JOB_ID" \
            --workflow-sha "$FIXED_TARGET_IMPLEMENTATION_SHA"

      - name: Independently validate formal acceptance bundle
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.run_fixed_target_acceptance validate-bundle \
            --bundle-root .fixed-target-formal/bundle

      - name: Final runtime 1.1 acceptance gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat /etc/planning-model-runner-image-id)" = "$FIXED_TARGET_RUNNER_IMAGE" || {
            echo "::error::FIXED_TARGET_RUNNER_IMAGE_ID_DRIFT:final"
            exit 1
          }
          python -m scripts.run_fixed_target_acceptance final-gate \
            --bundle-root .fixed-target-formal/bundle
          test -z "$(git status --porcelain=v1 --untracked-files=no)" || {
            echo "::error::FIXED_TARGET_IMPLEMENTATION_DIRTY_TREE_AT_FINAL_GATE"
            exit 1
          }

      - name: Upload formal evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixed-target-runtime-1-1-${{ github.run_id }}
          path: .fixed-target-formal/bundle
          if-no-files-found: ignore
          retention-days: 90

      - name: Cleanup claim-bearing workspace
        if: always()
        shell: bash
        run: |
          rm -rf .fixed-target-formal .pytest-tmp .pytest_cache
          git reset --hard HEAD
          git clean -ffdx
