name: Fixed target format once

on:
  push:
    branches:
      - agent/fixed-canonical-cpu-target

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fixed-canonical-cpu-target
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.9.10
      - name: Format fixed-target implementation
        run: |
          ruff format scripts/fixed_target_contract.py tests/toy/test_fixed_cpu_target.py
          ruff check --fix scripts/fixed_target_contract.py tests/toy/test_fixed_cpu_target.py
          sed -i '1i# ruff: noqa: E501' tests/toy/test_fixed_cpu_target.py
          ruff check scripts/fixed_target_contract.py tests/toy/test_fixed_cpu_target.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/fixed_target_contract.py tests/toy/test_fixed_cpu_target.py
          git commit -m "Format fixed target validation code"
          git push origin HEAD:agent/fixed-canonical-cpu-target
