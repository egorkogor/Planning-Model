name: Fixed target format once

on:
  push:
    branches:
      - agent/fixed-canonical-cpu-target

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fixed-canonical-cpu-target
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.9.10
      - name: Format fixed-target implementation
        run: |
          ruff format scripts/fixed_target_contract.py tests/toy/test_fixed_cpu_target.py
          ruff check --fix scripts/fixed_target_contract.py tests/toy/test_fixed_cpu_target.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/toy/test_fixed_cpu_target.py')
          text = path.read_text()
          text = text.replace(
              '"docs/evaluations/A2_A3_A4_HELDOUT_DIAGNOSTIC_RU.md": "e2344c07a76fcf7de140f894317fb509f6bc04fb",',
              '"docs/evaluations/A2_A3_A4_HELDOUT_DIAGNOSTIC_RU.md": "e2344c07a76fcf7de140f894317fb509f6bc04fb",  # noqa: E501',
          )
          text = text.replace(
              '"docs/evaluations/data/a2_a3_a4_heldout_summary.json": "408742e15a3cddacdefcb0f0b814a6d68a5ca62d",',
              '"docs/evaluations/data/a2_a3_a4_heldout_summary.json": "408742e15a3cddacdefcb0f0b814a6d68a5ca62d",  # noqa: E501',
          )
          path.write_text(text)
          PY
          ruff check scripts/fixed_target_contract.py tests/toy/test_fixed_cpu_target.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/fixed_target_contract.py tests/toy/test_fixed_cpu_target.py
          git commit -m "Format fixed target validation code"
          git push origin HEAD:agent/fixed-canonical-cpu-target
