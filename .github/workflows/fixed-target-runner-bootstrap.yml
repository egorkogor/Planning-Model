name: Fixed target host hardening and validation

on:
  push:
    branches:
      - ops/fixed-target-runner-bootstrap
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harden-and-validate:
    name: fixed-target-host-harden-and-validate
    runs-on:
      - self-hosted
      - linux
      - x64
      - planning-model-canonical-cpu-v1
    timeout-minutes: 10
    steps:
      - name: Freeze automatic package mutation
        shell: bash
        run: |
          set -euo pipefail
          sudo -n true

          sudo systemctl disable --now apt-daily.timer apt-daily-upgrade.timer
          sudo systemctl mask apt-daily.service apt-daily-upgrade.service

          cat <<'EOF' | sudo tee /etc/apt/apt.conf.d/99planning-model-fixed-target >/dev/null
          APT::Periodic::Enable "0";
          APT::Periodic::Update-Package-Lists "0";
          APT::Periodic::Unattended-Upgrade "0";
          EOF
          sudo chown root:root /etc/apt/apt.conf.d/99planning-model-fixed-target
          sudo chmod 0444 /etc/apt/apt.conf.d/99planning-model-fixed-target

          echo "apt_daily_timer_enabled=$(systemctl is-enabled apt-daily.timer || true)"
          echo "apt_daily_upgrade_timer_enabled=$(systemctl is-enabled apt-daily-upgrade.timer || true)"
          echo "apt_daily_timer_active=$(systemctl is-active apt-daily.timer || true)"
          echo "apt_daily_upgrade_timer_active=$(systemctl is-active apt-daily-upgrade.timer || true)"
          if [ -e /var/run/reboot-required ]; then
            echo 'REBOOT_REQUIRED_PRESENT'
            cat /var/run/reboot-required
            exit 1
          fi
          echo 'AUTOMATIC_PACKAGE_MUTATION_FROZEN'

      - name: Checkout materialized target contract
        uses: actions/checkout@v4
        with:
          ref: ba10d7305ce2abd1b9d6c8d0d18b28e523951217
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Revalidate contract against hardened live runner
        shell: bash
        run: |
          set -euo pipefail
          test -s /etc/planning-model-runner-image-id
          test "$(stat -c '%U:%G:%a' /etc/planning-model-runner-image-id)" = 'root:root:444'
          export FIXED_TARGET_RUNNER_IMAGE="$(cat /etc/planning-model-runner-image-id)"
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.fixed_target_contract import (
              collect_target_observation,
              target_contract_sha256,
              validate_target_contract,
          )

          contract = json.loads(Path('configs/fixed-cpu-target-1.0.json').read_text(encoding='utf-8'))
          validate_target_contract(contract)
          observation = collect_target_observation(contract)
          print('target_contract_sha256=' + target_contract_sha256(contract))
          print('observation_sha256=' + observation['observation_sha256'])
          print('actual_atten_cpu_capability=' + observation['actual_atten_cpu_capability'])
          print('FIXED_TARGET_HOST_HARDENED_AND_VALIDATED')
          PY
