name: Dispatch A2 optimization-budget trajectory (post-merge fresh)

on:
  push:
    branches:
      - ops/fixed-target-runner-bootstrap

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    name: dispatch-a2-optimization-budget-trajectory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_MAIN_SHA: 5b153a23c5746209191115653875167391df9dbf
      TARGET_CONTRACT_PATH: configs/fixed-cpu-target-1.0.json
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Verify and dispatch exact merged main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          observed_sha="$(git rev-parse HEAD)"
          test "$observed_sha" = "$EXPECTED_MAIN_SHA" || {
            echo "::error::MAIN_SHA_DRIFT: expected=$EXPECTED_MAIN_SHA observed=$observed_sha"
            exit 1
          }
          test -f "$TARGET_CONTRACT_PATH" || {
            echo "::error::TARGET_CONTRACT_NOT_ON_MAIN"
            exit 1
          }

          payload="$(python - <<'PY'
          import json, os
          print(json.dumps({
              'ref': 'main',
              'inputs': {
                  'implementation_sha': os.environ['EXPECTED_MAIN_SHA'],
                  'target_contract_path': os.environ['TARGET_CONTRACT_PATH'],
              },
          }))
          PY
          )"

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/a2-optimization-budget-trajectory.yml/dispatches" \
            -d "$payload"

          echo "A2_OPTIMIZATION_BUDGET_TRAJECTORY_DISPATCH_ACCEPTED"
