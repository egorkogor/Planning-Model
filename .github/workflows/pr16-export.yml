name: Finalize PR16 implementation

on:
  push:
    branches:
      - agent/a2-end-learnability-diagnostics
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: pip
      - name: Apply staged implementation payload
        shell: bash
        run: |
          set -euo pipefail
          cat .pr16-parts/part-* | base64 --decode > /tmp/pr16-changes.tar.xz
          printf '%s  %s\n' \
            '6e2112583c3569ccb4d6c835c97baf5d7ab820105b7e24cda9578bb97349514e' \
            '/tmp/pr16-changes.tar.xz' | sha256sum --check --strict
          tar -xJf /tmp/pr16-changes.tar.xz -C .
      - name: Install pinned runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
          python -m pip install torch==2.12.0+cpu \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[ml]' --no-deps
      - name: Verify frozen quality-v0.1 artifacts before tests
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            '133b3be3ec0d1a9d1025c32ddd60413344cea03bd4acb84eb8b60cc0e3a46df1' \
            'docs/evaluations/A2_A3_A4_HELDOUT_DIAGNOSTIC_RU.md' \
            '0a9c0cb0ee98fa4d458cb0a6fafa2e9e78bb0771a223d46a035f458c566df050' \
            'docs/evaluations/data/a2_a3_a4_heldout_summary.json' \
            'a1392b21961c728c7b4fa8686d6d095a345dc319fdfeec2b1e47eaaccb9b754a' \
            'docs/evaluations/A2_A3_A4_V0_1_DECISION_RU.md' | sha256sum --check --strict
      - name: Run targeted learnability tests
        run: python -m pytest -q tests/toy/test_learnability_diagnostic.py
      - name: Run relevant regression tests
        run: |
          python -m pytest -q \
            tests/toy/test_a2_e2e.py \
            tests/toy/test_quality_evaluation.py \
            tests/toy/test_quality_determinism.py
      - name: Run full toy suite
        run: python -m pytest -q tests/toy
      - name: Run repository per-file suite
        run: |
          python validation/run_test_suite.py \
            --timeout-per-file 120 \
            --log-dir .pytest-tmp/logs
      - name: Run repository validation and lint
        shell: bash
        run: |
          set -euo pipefail
          python validation/verify_release_manifest.py
          python validation/validate_bundle.py --skip-nested-pytest
          ruff check .
          python -m py_compile \
            planner_toy/learnability.py \
            scripts/run_toy_learnability_diagnostic.py
          git diff --check
      - name: Verify frozen artifacts and source scope after tests
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            '133b3be3ec0d1a9d1025c32ddd60413344cea03bd4acb84eb8b60cc0e3a46df1' \
            'docs/evaluations/A2_A3_A4_HELDOUT_DIAGNOSTIC_RU.md' \
            '0a9c0cb0ee98fa4d458cb0a6fafa2e9e78bb0771a223d46a035f458c566df050' \
            'docs/evaluations/data/a2_a3_a4_heldout_summary.json' \
            'a1392b21961c728c7b4fa8686d6d095a345dc319fdfeec2b1e47eaaccb9b754a' \
            'docs/evaluations/A2_A3_A4_V0_1_DECISION_RU.md' | sha256sum --check --strict
          test "$(git hash-object release/BOOTSTRAP_MANIFEST.json)" = \
            "$(git rev-parse HEAD:release/BOOTSTRAP_MANIFEST.json)"
      - name: Commit validated implementation and remove staging files
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pytest-tmp .pytest_cache
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          rm -f /tmp/pr16-changes.tar.xz
          git rm -r .pr16-parts .github/workflows/pr16-export.yml
          git add \
            planner_toy/learnability.py \
            planner_toy/learnability_diagnostic.schema.json \
            scripts/run_toy_learnability_diagnostic.py \
            tests/toy/test_learnability_diagnostic.py \
            docs/evaluations/A2_END_COLLAPSE_DIAGNOSTIC_SPEC_RU.md
          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/pr16-export.yml',
              '.pr16-parts/part-00',
              '.pr16-parts/part-01',
              '.pr16-parts/part-02',
              '.pr16-parts/part-03',
              'docs/evaluations/A2_END_COLLAPSE_DIAGNOSTIC_SPEC_RU.md',
              'planner_toy/learnability.py',
              'planner_toy/learnability_diagnostic.schema.json',
              'scripts/run_toy_learnability_diagnostic.py',
              'tests/toy/test_learnability_diagnostic.py',
          }
          actual = set(
              subprocess.check_output(
                  ['git', 'diff', '--cached', '--name-only'], text=True
              ).splitlines()
          )
          if actual != expected:
              raise SystemExit(
                  f'unexpected staged paths: missing={sorted(expected-actual)} '
                  f'extra={sorted(actual-expected)}'
              )
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add A2 END-only learnability diagnostics'
          git push origin HEAD:agent/a2-end-learnability-diagnostics
