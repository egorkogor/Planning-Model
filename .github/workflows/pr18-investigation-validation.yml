name: Finalize PR18 Investigation

on:
  push:
    branches:
      - agent/pin-canonical-cpu-execution-identity

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pin-canonical-cpu-execution-identity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: pip
      - name: Align parity harness with lazy AdamW state creation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/run_canonical_training_probe.py")
          text = path.read_text(encoding="utf-8")
          old = '''    for name, parameter in named_parameters:
              state = optimizer.state[parameter]
              exp_avg[name] = _tensor_sha256(state["exp_avg"])
              exp_avg_sq[name] = _tensor_sha256(state["exp_avg_sq"])
          '''
          new = '''    for name, parameter in named_parameters:
              state = optimizer.state.get(parameter)
              if not state:
                  continue
              exp_avg[name] = _tensor_sha256(state["exp_avg"])
              exp_avg_sq[name] = _tensor_sha256(state["exp_avg_sq"])
          '''
          if text.count(old) != 1:
              raise SystemExit("expected one parity AdamW state block")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Install pinned runtime
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
          python -m pip install torch==2.12.0+cpu \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[ml]'
      - name: Validate parity fix
        run: |
          ruff check .
          python -m pytest -q \
            tests/toy/test_canonical_hardware_fingerprint.py \
            tests/toy/test_canonical_training_probe.py
          env -u ATEN_CPU_CAPABILITY -u MKL_CBWR \
            python -m scripts.run_canonical_training_probe parity \
            --output /tmp/parity.json
          python -m py_compile \
            scripts/canonical_cpu_hardware_fingerprint.py \
            scripts/run_canonical_training_probe.py
      - name: Commit clean final tree
        run: |
          git rm .github/workflows/pr18-investigation-validation.yml
          if test -f .pr18-validation-trigger; then
            git rm .pr18-validation-trigger
          fi
          git add scripts/run_canonical_training_probe.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Align probe parity with lazy AdamW state creation'
          git push origin HEAD:agent/pin-canonical-cpu-execution-identity
