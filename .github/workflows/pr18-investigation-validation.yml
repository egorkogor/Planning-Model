name: PR18 Investigation Validation

on:
  push:
    branches:
      - agent/pin-canonical-cpu-execution-identity

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pin-canonical-cpu-execution-identity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: pip
      - name: Install pinned runtime
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
          python -m pip install torch==2.12.0+cpu \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[ml]'
      - name: Requested static and targeted checks
        run: |
          ruff check .
          python -m pytest -q \
            tests/toy/test_canonical_hardware_fingerprint.py \
            tests/toy/test_canonical_training_probe.py
          python -m py_compile \
            scripts/canonical_cpu_hardware_fingerprint.py \
            scripts/run_canonical_training_probe.py
      - name: Clean-process profile reproducibility
        run: |
          set -euo pipefail
          mkdir -p .probe-validation
          for n in 1 2; do
            env -u ATEN_CPU_CAPABILITY -u MKL_CBWR \
              python -m scripts.run_canonical_training_probe run \
              --profile historical-default \
              --output .probe-validation/historical-default-$n.json
            ATEN_CPU_CAPABILITY=default MKL_CBWR=COMPATIBLE \
              python -m scripts.run_canonical_training_probe run \
              --profile default-single-tensor \
              --optimizer-foreach false \
              --optimizer-fused false \
              --output .probe-validation/default-single-tensor-$n.json
            ATEN_CPU_CAPABILITY=avx2 MKL_CBWR=COMPATIBLE \
              python -m scripts.run_canonical_training_probe run \
              --profile avx2-single-tensor \
              --optimizer-foreach false \
              --optimizer-fused false \
              --output .probe-validation/avx2-single-tensor-$n.json
          done
          cmp .probe-validation/historical-default-1.json \
              .probe-validation/historical-default-2.json
          cmp .probe-validation/default-single-tensor-1.json \
              .probe-validation/default-single-tensor-2.json
          cmp .probe-validation/avx2-single-tensor-1.json \
              .probe-validation/avx2-single-tensor-2.json
      - name: Toy and full suites
        run: |
          python -m pytest -q tests/toy
          python validation/run_test_suite.py \
            --timeout-per-file 120 \
            --log-dir .pytest-tmp/logs
      - name: Manifest and bundle
        run: |
          python validation/verify_release_manifest.py
          python validation/validate_bundle.py --skip-nested-pytest
      - name: Frozen scope remains unchanged
        run: |
          git diff --exit-code origin/main -- \
            planner_toy/canonical_runtime.py \
            .github/workflows/ci.yml \
            docs/evaluations/A2_A3_A4_HELDOUT_DIAGNOSTIC_RU.md \
            docs/evaluations/data/a2_a3_a4_heldout_summary.json \
            docs/evaluations/A2_A3_A4_V0_1_DECISION_RU.md
