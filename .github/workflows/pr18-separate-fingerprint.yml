name: Finalize separated hardware fingerprint

on:
  push:
    branches:
      - agent/pin-canonical-cpu-execution-identity

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/pin-canonical-cpu-execution-identity
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: pip
      - name: Restore frozen runtime and patch probe imports
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- \
            planner_toy/canonical_runtime.py \
            tests/toy/test_canonical_runtime.py
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/run_canonical_training_probe.py")
          text = path.read_text(encoding="utf-8")
          old = '''from planner_toy.canonical_runtime import (
              LEGACY_CANONICAL_CPU_RUNTIME_VERSION,
              configure_canonical_cpu_runtime,
              full_hardware_runtime_fingerprint,
              observed_runtime_and_hardware,
          )
          '''
          new = '''from planner_toy.canonical_runtime import (
              CANONICAL_CPU_RUNTIME_VERSION as LEGACY_CANONICAL_CPU_RUNTIME_VERSION,
              configure_canonical_cpu_runtime,
          )
          from scripts.canonical_cpu_hardware_fingerprint import (
              full_hardware_runtime_fingerprint,
              observed_runtime_and_hardware,
          )
          '''
          if old not in text:
              raise SystemExit("probe import block not found")
          text = text.replace(old, new, 1)
          text = text.replace(
              "hardware = full_hardware_runtime_fingerprint()",
              "hardware = full_hardware_runtime_fingerprint(runtime)",
              1,
          )
          text = text.replace(
              '"observed_runtime_and_hardware": observed_runtime_and_hardware(),',
              '"observed_runtime_and_hardware": observed_runtime_and_hardware(runtime),',
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Install and validate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
          python -m pip install torch==2.12.0+cpu \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[ml]'
          ruff check .
          python -m pytest -q \
            tests/toy/test_canonical_runtime.py \
            tests/toy/test_canonical_hardware_fingerprint.py \
            tests/toy/test_canonical_training_probe.py
          python validation/verify_release_manifest.py
          python validation/validate_bundle.py --skip-nested-pytest
          python -m py_compile \
            scripts/canonical_cpu_hardware_fingerprint.py \
            scripts/run_canonical_training_probe.py
      - name: Commit clean investigation tree
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr18-separate-fingerprint.yml
          git add \
            planner_toy/canonical_runtime.py \
            tests/toy/test_canonical_runtime.py \
            scripts/canonical_cpu_hardware_fingerprint.py \
            scripts/run_canonical_training_probe.py \
            tests/toy/test_canonical_hardware_fingerprint.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Separate hardware evidence from frozen runtime source'
          git push origin HEAD:agent/pin-canonical-cpu-execution-identity
