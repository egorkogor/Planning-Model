name: Apply PR19 foundation payload

on:
  push:
    branches:
      - agent/fixed-canonical-cpu-target

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fixed-canonical-cpu-target
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.9.10
      - name: Apply payload
        shell: bash
        run: |
          set -euo pipefail
          cat .pr19-payload/chunk-* | base64 -d > /tmp/pr19.tar.gz
          tar xzf /tmp/pr19.tar.gz -C .
          git checkout -- .github/workflows/fixed-target-acceptance.yml
          git checkout -- .github/workflows/pr19-apply-foundation.yml
          rm -rf .pr19-payload
          python -m py_compile scripts/fixed_target_contract.py scripts/run_fixed_target_acceptance.py tests/toy/test_fixed_cpu_target.py tests/toy/test_fixed_target_blocked_evidence.py
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('planner_toy/schemas').glob('toy_quality_fixed_*.schema.json'):
              json.loads(path.read_text(encoding='utf-8'))
          PY
          ruff format scripts/fixed_target_contract.py scripts/run_fixed_target_acceptance.py tests/toy/test_fixed_cpu_target.py tests/toy/test_fixed_target_blocked_evidence.py
          ruff check --fix --ignore E501 scripts/fixed_target_contract.py scripts/run_fixed_target_acceptance.py tests/toy/test_fixed_cpu_target.py tests/toy/test_fixed_target_blocked_evidence.py || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Harden fixed target acceptance foundation"
          git push origin HEAD:agent/fixed-canonical-cpu-target
