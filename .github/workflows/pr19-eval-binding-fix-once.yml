name: PR19 evaluation binding fix once

on:
  push:
    branches:
      - agent/fixed-canonical-cpu-target

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fixed-canonical-cpu-target
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bind evaluation config implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/fixed_target_contract.py')
          text = path.read_text(encoding='utf-8')
          old = '''    if preflight.get("implementation_commit") != implementation:\n        raise ValueError("FIXED_TARGET_EXECUTION_IMPLEMENTATION_MISMATCH")\n    if evidence["target_contract_sha256"] != acceptance["target_contract_sha256"]:\n'''
          new = '''    if preflight.get("implementation_commit") != implementation:\n        raise ValueError("FIXED_TARGET_EXECUTION_IMPLEMENTATION_MISMATCH")\n    if evaluation_config.get("implementation_commit") != implementation:\n        raise ValueError("FIXED_TARGET_EXECUTION_IMPLEMENTATION_MISMATCH")\n    if evidence["target_contract_sha256"] != acceptance["target_contract_sha256"]:\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one implementation binding insertion point, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')

          test_path = Path('tests/toy/test_fixed_cpu_target.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = '''def test_execution_runtime_contract_mismatch_rejected(monkeypatch: pytest.MonkeyPatch) -> None:\n'''
          addition = '''def test_evaluation_execution_implementation_mismatch_rejected(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    acceptance, evidence, preflight, config, training = _binding_inputs(monkeypatch)\n    config["implementation_commit"] = "b" * 40\n    with pytest.raises(ValueError, match="FIXED_TARGET_EXECUTION_IMPLEMENTATION_MISMATCH"):\n        validate_execution_binding_contract(\n            evidence,\n            acceptance=acceptance,\n            attempt=acceptance["attempts"][0],\n            preflight=preflight,\n            evaluation_config=config,\n            target_observation=acceptance["attempts"][0]["target_observation"],\n            training_configs=training,\n        )\n\n\n'''
          if tests.count(marker) != 1:
              raise SystemExit(f'expected one test insertion point, found {tests.count(marker)}')
          test_path.write_text(tests.replace(marker, addition + marker), encoding='utf-8')
          PY
          python -m pip install ruff==0.9.10
          ruff format scripts/fixed_target_contract.py tests/toy/test_fixed_cpu_target.py
          ruff check scripts/fixed_target_contract.py tests/toy/test_fixed_cpu_target.py
          python -m py_compile scripts/fixed_target_contract.py tests/toy/test_fixed_cpu_target.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/fixed_target_contract.py tests/toy/test_fixed_cpu_target.py
          git commit -m "Bind execution evidence to evaluation implementation"
          git push origin HEAD:agent/fixed-canonical-cpu-target
