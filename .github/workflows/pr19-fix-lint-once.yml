name: Fix PR19 lint once

on:
  push:
    branches:
      - agent/fixed-canonical-cpu-target

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fixed-canonical-cpu-target
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.9.10
      - name: Mark exact frozen hash guards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/toy/test_fixed_cpu_target.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          targets = {
              'A2_A3_A4_HELDOUT_DIAGNOSTIC_RU.md',
              'a2_a3_a4_heldout_summary.json',
          }
          changed = 0
          output = []
          for line in lines:
              if any(target in line for target in targets) and '# noqa: E501' not in line:
                  line += '  # noqa: E501'
                  changed += 1
              output.append(line)
          if changed != 2:
              raise SystemExit(f'expected 2 exact frozen hash guard lines, changed {changed}')
          path.write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY
          ruff check tests/toy/test_fixed_cpu_target.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/toy/test_fixed_cpu_target.py
          git commit -m "Fix fixed target test lint guards"
          git push origin HEAD:agent/fixed-canonical-cpu-target
