                      },
                  },
                  'execution_migration': {
                      'type': 'object',
                      'additionalProperties': False,
                      'required': ['runtime_version', 'fixed_target', 'optimizer_foreach', 'optimizer_fused'],
                      'properties': {
                          'runtime_version': {'const': 'toy-quality-canonical-cpu-runtime/1.1'},
                          'fixed_target': {'const': True},
