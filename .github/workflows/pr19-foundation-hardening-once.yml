                          'ordered_eval_task_ids': {
                              'type': 'array', 'minItems': 1, 'uniqueItems': True,
                              'items': {'type': 'string', 'minLength': 1},
                          },
                      },
                  },
                  'variants': {'const': ['A2', 'A3', 'A4']},
                  'seeds': {'const': [17, 29, 43]},
                  'epochs': {'const': 3},
