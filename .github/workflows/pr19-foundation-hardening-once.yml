              'science/execution insertion',
          )

          acceptance_function = r'''def _validate_acceptance_record_structure(
    acceptance: dict[str, Any],
    *,
    allow_final_accepted: bool,
) -> None:
    _validate_schema(
        "fixed_target_acceptance.schema.json",
