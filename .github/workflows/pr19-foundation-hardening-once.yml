                  'execution_evidence_sha256',
              ],
              'properties': {
                  'execution_evidence_version': {'const': 'toy-quality-fixed-target-execution-evidence/1.0'},
                  'implementation_commit': COMMIT,
                  'target_contract_sha256': HASH,
                  'runtime_contract_sha256': HASH,
                  'target_observation_sha256': HASH,
                  'source_inventory_sha256': HASH,
                  'scientific_policy': {'$ref': 'fixed_target_scientific_policy.schema.json'},
                  'scientific_policy_sha256': HASH,
                  'evaluator_version': {'type': 'string', 'minLength': 1},
                  'evaluator_source_sha256': HASH,
                  'requirements_lock_sha256': HASH,
                  'dataset_identity': {
                      'type': 'object',
                      'additionalProperties': False,
