                  'historical_quality_implementation_commit': COMMIT,
                  'historical_evaluator_version': {'const': 'development-quality-evaluation/0.1'},
                  'historical_evaluator_source_sha256': {
                      'const': 'sha256:9205ad312fc37fa9927505e9c44a599e29fc5e31180db9d2e49ebfcc247b4570'
                  },
                  'dataset_seed': {'const': 17},
                  'dataset_hash': HASH,
                  'variants': {'const': ['A2', 'A3', 'A4']},
                  'seeds': {'const': [17, 29, 43]},
                  'epochs': {'const': 3},
                  'updates_per_run': {'const': 9},
                  'checkpoint_policy': {'const': 'final_epoch_only_no_heldout_selection'},
                  'training_execution_mode': {'const': 'TRAINED_IN_RUN'},
                  'optimizer': {
                      'type': 'object',
                      'additionalProperties': False,
                      'required': ['class', 'learning_rate', 'betas', 'eps', 'weight_decay'],
                      'properties': {
                          'class': {'const': 'AdamW'},
