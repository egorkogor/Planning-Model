          def write_json(path: Path, value: object) -> None:
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 replacement, found {count}')
              return text.replace(old, new)

          # 1) Move fixed-target schemas out of historical toy_*.schema.json namespace.
          renames = {
              'toy_quality_fixed_cpu_target.schema.json': 'fixed_target_cpu_target.schema.json',
              'toy_quality_fixed_runtime.schema.json': 'fixed_target_runtime.schema.json',
              'toy_quality_fixed_target_acceptance.schema.json': 'fixed_target_acceptance.schema.json',
              'toy_quality_fixed_target_observation.schema.json': 'fixed_target_observation.schema.json',
          }
          id_map = {
              old: f'https://planning-model.local/schemas/{new}'
              for old, new in renames.items()
          }
          ref_map = {old: new for old, new in renames.items()}

          def rewrite_refs(value: object) -> object:
              if isinstance(value, dict):
                  result = {}
                  for key, item in value.items():
                      if key == '$ref' and isinstance(item, str):
                          result[key] = ref_map.get(item, item)
                      else:
                          result[key] = rewrite_refs(item)
                  return result
              if isinstance(value, list):
                  return [rewrite_refs(item) for item in value]
              return value

          for old_name, new_name in renames.items():
              old_path = SCHEMA_ROOT / old_name
              new_path = SCHEMA_ROOT / new_name
              data = json.loads(old_path.read_text(encoding='utf-8'))
              data = rewrite_refs(data)
              data['$id'] = id_map[old_name]
              if old_name == 'toy_quality_fixed_target_acceptance.schema.json':
                  attempt = data['properties']['attempts']['items']
                  attempt['required'] = [
                      item for item in attempt['required'] if item != 'probe_identity'
                  ]
                  attempt['properties'].pop('probe_identity', None)
                  if 'execution_evidence_sha256' not in attempt['required']:
                      insert_at = attempt['required'].index('source_inventory_sha256') + 1
                      attempt['required'].insert(insert_at, 'execution_evidence_sha256')
                  attempt['properties']['execution_evidence_sha256'] = {
                      'type': 'string',
                      'pattern': '^sha256:[0-9a-f]{64}$',
                  }
              write_json(new_path, data)
              old_path.unlink()

          HASH = {'type': 'string', 'pattern': '^sha256:[0-9a-f]{64}$'}
          COMMIT = {'type': 'string', 'pattern': '^[0-9a-f]{40}$'}

