                      },
                  },
                  'scientific_policy_sha256': HASH,
              },
          }
          write_json(SCHEMA_ROOT / 'fixed_target_scientific_policy.schema.json', scientific_schema)

          execution_schema = {
              '$schema': 'https://json-schema.org/draft/2020-12/schema',
              '$id': 'https://planning-model.local/schemas/fixed_target_execution_evidence.schema.json',
              'type': 'object',
              'additionalProperties': False,
              'required': [
