name: Run PR19 foundation patch once

on:
  push:
    branches:
      - agent/fixed-canonical-cpu-target

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fixed-canonical-cpu-target
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract and apply source patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/pr19-foundation-hardening-once.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          payload = []
          for line in source[start:end]:
              if line.startswith('          '):
                  line = line[10:]
              payload.append(line)
          Path('/tmp/pr19_patch.py').write_text('\n'.join(payload) + '\n', encoding='utf-8')
          PY
          python /tmp/pr19_patch.py
          python - <<'PY'
          from pathlib import Path

          repaired_total = 0
          for filename in ('scripts/fixed_target_contract.py', 'tests/toy/test_fixed_cpu_target.py'):
              path = Path(filename)
              lines = path.read_text(encoding='utf-8').splitlines()
              repaired = 0
              for index, line in enumerate(lines):
                  if not line.startswith('  raise '):
                      continue
                  previous = index - 1
                  while previous >= 0 and not lines[previous].strip():
                      previous -= 1
                  if previous < 0 or not lines[previous].rstrip().endswith(':'):
                      raise SystemExit(f'cannot infer generated raise indentation in {filename}:{index + 1}')
                  previous_indent = len(lines[previous]) - len(lines[previous].lstrip(' '))
                  lines[index] = ' ' * (previous_indent + 4) + line.lstrip()
                  repaired += 1
              path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
              print(f'{filename}: repaired generated raise indentation: {repaired}')
              repaired_total += repaired
          if repaired_total < 27:
              raise SystemExit(f'expected generated indentation repairs, got {repaired_total}')

          path = Path('tests/toy/test_fixed_cpu_target.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          starts = [i for i, line in enumerate(lines) if line == '  training_configs.append(']
          if len(starts) != 1:
              raise SystemExit(f'expected one generated nested block, found {len(starts)}')
          start = starts[0]
          end = start
          while end < len(lines) and lines[end] != '  )':
              end += 1
          if end >= len(lines):
              raise SystemExit('generated nested block closing line not found')
          for index in range(start, end + 1):
              lines[index] = '          ' + lines[index]
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(f'repaired generated nested block: lines {start + 1}-{end + 1}')
          PY
          python -m py_compile scripts/fixed_target_contract.py scripts/run_fixed_target_acceptance.py tests/toy/test_fixed_cpu_target.py tests/toy/test_fixed_target_blocked_evidence.py
          python -m pip install ruff==0.9.10
          ruff format scripts/fixed_target_contract.py scripts/run_fixed_target_acceptance.py tests/toy/test_fixed_cpu_target.py tests/toy/test_fixed_target_blocked_evidence.py
          ruff check scripts/fixed_target_contract.py scripts/run_fixed_target_acceptance.py tests/toy/test_fixed_cpu_target.py tests/toy/test_fixed_target_blocked_evidence.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/evaluations/FIXED_CANONICAL_CPU_TARGET_RU.md planner_toy/schemas scripts/fixed_target_contract.py scripts/run_fixed_target_acceptance.py tests/toy/test_fixed_cpu_target.py tests/toy/test_fixed_target_blocked_evidence.py
          git commit -m "Harden PR19 runtime 1.1 foundation boundary"
          git push origin HEAD:agent/fixed-canonical-cpu-target
