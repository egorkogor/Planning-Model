name: PR19 ruff formatting fix
on:
  push:
    branches:
      - agent/fixed-canonical-cpu-target
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fixed-canonical-cpu-target
          fetch-depth: 0
          persist-credentials: true
      - name: Fix two E501 diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/toy/test_fixed_cpu_target.py')
          text = path.read_text()
          old = '''        (["bw-00000002", "bw-00000001", "bw-00000003"], "FIXED_TARGET_EXECUTION_TRAIN_SPLIT_MISMATCH"),'''
          new = '''        (
                      ["bw-00000002", "bw-00000001", "bw-00000003"],
                      "FIXED_TARGET_EXECUTION_TRAIN_SPLIT_MISMATCH",
                  ),'''
          if old not in text:
              raise SystemExit('first E501 anchor not found')
          text = text.replace(old, new, 1)
          old = '''        lambda locked: locked.__setitem__("evaluator_version", "development-quality-evaluation/0.2"),'''
          new = '''        lambda locked: locked.__setitem__(
                      "evaluator_version", "development-quality-evaluation/0.2"
                  ),'''
          if old not in text:
              raise SystemExit('second E501 anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/pr19-ruff-fix.yml
          git add tests/toy/test_fixed_cpu_target.py
          git commit -m "Format fixed-target scientific policy regressions"
          git push origin HEAD:agent/fixed-canonical-cpu-target
