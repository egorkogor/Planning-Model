name: Canonical quality results once

on:
  push:
    branches:
      - codex/add-held-out-quality-evaluation-for-a2-a3-a4-o9265x
    paths:
      - .github/workflows/quality-results-once.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    env:
      IMPLEMENTATION_SHA: 85673afa433bfe8774b11d94a988c2b3028fb358
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/add-held-out-quality-evaluation-for-a2-a3-a4-o9265x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: pip
      - name: Install pinned runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
          python -m pip install torch==2.12.0+cpu \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[ml]'
      - name: Regenerate and validate canonical results
        run: |
          git cat-file -e "${IMPLEMENTATION_SHA}^{commit}"
          git merge-base --is-ancestor "$IMPLEMENTATION_SHA" HEAD
          python -m scripts.run_toy_quality_evaluation \
            --output-dir .quality-results-once \
            --implementation-commit "$IMPLEMENTATION_SHA"
          python -m scripts.run_toy_quality_evaluation \
            --output-dir .quality-results-once \
            --validate-only \
            --compact-dir .quality-compact-once
          cp .quality-compact-once/A2_A3_A4_HELDOUT_DIAGNOSTIC_RU.md \
            docs/evaluations/A2_A3_A4_HELDOUT_DIAGNOSTIC_RU.md
          cp .quality-compact-once/data/a2_a3_a4_heldout_summary.json \
            docs/evaluations/data/a2_a3_a4_heldout_summary.json
          rm -rf .quality-results-once .quality-compact-once
      - name: Remove one-shot workflow and refresh trust root
        run: |
          rm .github/workflows/quality-results-once.yml
          python scripts/build_release_manifest.py
          python validation/verify_release_manifest.py
          python validation/validate_bundle.py --skip-nested-pytest
      - name: Commit generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/evaluations/A2_A3_A4_HELDOUT_DIAGNOSTIC_RU.md \
            docs/evaluations/data/a2_a3_a4_heldout_summary.json \
            release/BOOTSTRAP_MANIFEST.json \
            .github/workflows/quality-results-once.yml
          git diff --cached --check
          git commit -m "Regenerate canonical quality results"
          git push origin HEAD:codex/add-held-out-quality-evaluation-for-a2-a3-a4-o9265x
