purpose: >-
  Define, as an additive amendment layered on the accepted closed-bottleneck validity audit, the
  measurement construct a future editability study would need: separating channel usability,
  normal trained-model reliance, targeted editability, directional edit precision, and
  edit-strength dose-response, plus an explicit oracle-tier boundary — without performing any
  intervention on a trained model and without touching the accepted parent surfaces.

intervention_class:
  purpose: >-
    Editing the trained model's own latent/concept state and supplying an oracle/control concept
    are mechanically distinct intervention classes. Every editability row MUST declare exactly one
    of the two classes below; neither class may be silently coerced into the other.
  collapse_into_single_intervention_class: "FORBIDDEN"
  silent_coercion: "FORBIDDEN — a row must never be relabeled from one intervention class to the other"
  TRAINED_STATE_EDIT:
    definition: >-
      Edits, substitutes, or transforms the trained model's own concept/latent state under exact
      checkpoint identity (no retraining), at a declared downstream position, then scores whether
      the downstream resolver reaches a predeclared intended target decision. This is the primary
      intervention class for targeted_editability, directional_edit_precision, and
      edit_strength_dose_response.
    oracle_tier_requirement: "MUST_NOT_BE_REQUIRED"
    oracle_tier_absence_effect: "absence of a declared oracle tier MUST NOT make the observation invalid"
    oracle_semantics_applicable: false
    status: "DESIGN_ONLY_NOT_AUTHORIZED_FOR_EXECUTION"
    still_applies:
      - "intended-target declaration"
      - "matched non-concept context (for directional scoring)"
      - "exact checkpoint identity / no-retraining"
      - "matched-pair requirements for directional scoring"
      - "censoring and dose-response rules"
    forbidden_inference: "that trained-state edit success implies normal unedited-model reliance, or that it decomposes the unedited representation into human-factorized semantic coordinates"
  ORACLE_CONTROL:
    definition: >-
      A control/diagnostic intervention that injects an oracle-defined concept (not the trained
      model's own edited state) to establish allowed-channel usability, i.e. whether the downstream
      resolver can use the declared concept channel at all.
    oracle_tier_requirement: "MUST_BE_DECLARED"
    allowed_oracle_tiers: ["ORACLE-STRUCT", "ORACLE-FULL"]
    undeclared_tier_effect: "INVALID_ORACLE_TIER_UNSPECIFIED"
    forbidden_inference: "that oracle-control success implies normal trained-model reliance, or semantic decomposition of the unedited representation"
  type_mismatch:
    trained_state_edit_with_oracle_tier_attached:
      failure: "INVALID_INTERVENTION_CLASS_MISMATCH"
      rule: >-
        a TRAINED_STATE_EDIT row MUST NOT declare an oracle_tier; declaring one is a fail-closed
        error, never a silent relabel to ORACLE_CONTROL.
    oracle_control_treated_as_trained_state_edit:
      failure: "INVALID_INTERVENTION_CLASS_MISMATCH"
      rule: >-
        an ORACLE_CONTROL row MUST NOT be scored under targeted_editability,
        directional_edit_precision, or edit_strength_dose_response; those constructs bind to
        TRAINED_STATE_EDIT only.
    unknown_or_unspecified_intervention_class:
      failure: "INVALID_INTERVENTION_CLASS_UNSPECIFIED"
      rule: >-
        every row MUST declare exactly one of TRAINED_STATE_EDIT or ORACLE_CONTROL; a missing or
        unrecognized value is fail-closed, never defaulted to either class.

construct_decomposition:
  collapse_into_single_construct: "FORBIDDEN"
  allowed_channel_usability:
    question: "Can the downstream resolver use the declared concept channel at all, when supplied an oracle concept?"
    established_by: "closed_bottleneck_validity_audit_v1.yaml#counterfactual_oracle_control (read-only)"
    this_audit_adds: "NONE — reference only, no new mechanism"
    intervention_class: "ORACLE_CONTROL"
    forbidden_inference: "that the unedited trained model normally relies on the channel"
  normal_trained_model_reliance:
    question: >-
      Under zero/shuffle/wrong-donor same-checkpoint interventions, does the unedited trained
      model's behavior depend on feedback path/content/order?
    established_by: "semantic_feedback_causal_eval_v1.yaml#EST-PLN-SEM-RELIANCE (read-only)"
    this_audit_adds: "NONE — reference only, no new mechanism"
    intervention_class: "INHERITED_EXISTING_ZERO_SHUFFLE_WRONG_DONOR_CONTROLS_NOT_REDEFINED_HERE"
    forbidden_inference: "that reliance implies the representation is human-factorized or that targeted edits are precise"
  targeted_editability:
    question: >-
      Given a trained model state and a declared edit to concept content, can the edit cause the
      downstream resolver to reach a specific, predeclared intended target decision — as opposed
      to merely causing any change relative to the unedited baseline?
    new_in_this_audit: true
    intervention_class: "TRAINED_STATE_EDIT"
    distinguishes: "intended-target success vs merely-any-change"
    forbidden_inference: "that targeted editability implies the unedited model normally uses this coordinate for the same purpose"
  directional_edit_precision:
    question: >-
      When an edit is constructed to move concept content toward a specific declared target (as
      opposed to an undirected move away from current content), does the downstream decision move
      toward the intended target and not toward an unintended alternative?
    new_in_this_audit: true
    intervention_class: "TRAINED_STATE_EDIT"
    requires: "matched non-concept context and an explicit intended target action/policy consequence declared before scoring"
  edit_strength_dose_response:
    question: >-
      As edit strength/magnitude is varied along a predeclared graded scale, does the probability
      or degree of reaching the intended target respond in a predeclared, reportable functional
      form, as opposed to being step-function-invariant across all nonzero strengths?
    new_in_this_audit: true
    intervention_class: "TRAINED_STATE_EDIT"
    scope: "defines what a dose-response measurement would need to identify; does not run one"

estimand:
  id: "EST-PLN-BOTTLENECK-EDIT-PRECISION"
  rq: "RQ-PLN-BOTTLENECK-001"
  owning_surface: ".research/audits/closed_bottleneck_editability_audit_v1.yaml"
  status: "DESIGN_ONLY_NOT_FROZEN_FOR_EXECUTION"
  estimand_definition: >-
    Given the closed-bottleneck allowed concept channel with mechanical closure and allowed-channel
    usability already established by the parent audit, the directional and graded causal effect of
    a declared edit to z_semantic on whether the downstream resolver reaches a specific predeclared
    intended target decision — separated from (a) whether the channel can carry any signal at all
    and (b) whether the unedited trained model relies on the channel under non-directional
    interventions.
  allowed_interpretation: >-
    A future execution may show that a declared edit of a given direction/strength changes the
    probability of reaching the specific intended target decision, conditional on matched
    non-concept context and mechanical closure already holding.
  forbidden_interpretation:
    - "that editability or directional precision proves normal trained-model reliance"
    - "that oracle-tier success proves normal trained-model reliance"
    - "that editability or directional precision proves the unedited representation has a human-factorized or semantically decomposed coordinate system"
    - "that a single successful edit generalizes to arbitrary targets, directions, or magnitudes"
    - "any pooled single 'editability effect' collapsing usability/reliance/editability/precision/dose-response"
  downstream_position_required: true
  zero_downstream_position_semantics: "NOT_EVALUATED_NO_DOWNSTREAM_POSITION"

target_hit_vs_any_change:
  required_separate_fields:
    - "any_change: whether the downstream decision differs from the unedited baseline decision"
    - "target_hit: whether the downstream decision equals the single predeclared intended target decision"
  precondition: "intended target action/policy consequence must be declared before the edit is applied/scored"
  collapse_any_change_into_target_hit: "FORBIDDEN"
  any_change_without_target_hit: "does not by itself support a directional-precision claim"

directional_scoring_requirements:
  applies_to_intervention_class: "TRAINED_STATE_EDIT"
  matched_non_concept_context:
    rule: >-
      BYTE_IDENTICAL across the pre-edit reference state and the edited counterfactual, consistent
      with closed_bottleneck_validity_audit_v1.yaml#counterfactual_oracle_control construction
    failure: "INVALID_CONTEXT_MISMATCH"
  intended_target_declaration:
    rule: "the intended target action/policy consequence is declared and recorded before the downstream decision is observed"
    failure: "INVALID_TARGET_UNDECLARED"
  matched_pairing_for_direction:
    rule: >-
      directional scoring requires a construction analogous to the parent audit's matched
      in-distribution wrong-concept donor: an edit toward target A and, where directional scoring
      is requested, a contrasting edit toward target B under the same matched non-concept context
    unavailable_state: "NOT_EVALUATED_NO_MATCHED_PAIR"

edit_strength_and_dose_response_requirements:
  applies_to_intervention_class: "TRAINED_STATE_EDIT"
  strength_parameterization: >-
    a future study must predeclare a graded/interpolated edit-strength scale (for example, a
    magnitude of displacement toward the target relative to a predeclared unit) before any outcome
    is observed; this audit does not itself fix the numeric scale, units, or interpolation method
  dose_response_grade_requirement:
    minimum_predeclared_nonzero_intermediate_grades: 1
    minimum_total_grades_including_zero_and_full: 3
    insufficient_state: "INSUFFICIENT_GRADES_FOR_DOSE_RESPONSE"
    reason: >-
      a single discrete full-vector swap (as used by existing zero/shuffle/wrong-donor
      interventions) is insufficient to support a dose-response claim; at least one intermediate,
      predeclared, non-zero, non-full strength level is required in addition to zero and full
  monotonicity_claim: "NOT_ASSUMED — a future study reports the observed functional form rather than assuming monotonicity"
  full_vector_swap_reuse: >-
    the zero/full-strength endpoints of a future dose-response sweep may reuse the parent audit's
    zero/shuffle/wrong-concept-donor mechanisms by reference; this audit does not redefine them

oracle_tiers:
  applies_to_intervention_class: "ORACLE_CONTROL"
  not_applicable_to: "TRAINED_STATE_EDIT — a trained-state edit row never declares an oracle tier"
  collapse_into_single_oracle_tier: "FORBIDDEN"
  ORACLE-STRUCT:
    definition: >-
      An oracle/control concept probe built from the concept space that is actually implemented and
      available today: the structural/operator-derived space used by the current A3a-codebook
      family (per docs/architecture/COGNITIVE_PLANNER_FUTURE_ARCHITECTURE_RU.md section 19, the
      implemented target is SHA-derived from action/arg1/arg2/seed/target_config).
    status: "SPECIFIABLE_NOW"
    proves: "channel usability and targeted-edit mechanics within the currently available concept space"
    forbidden_inference: "that ORACLE-STRUCT success shows the trained model's actual unedited representation is organized this way"
  ORACLE-FULL:
    definition: >-
      An oracle/control concept probe built from a richer, genuinely semantic concept space that is
      not derived from a structural/operator hash — a future target such as `A3s-semantic-target`.
    status: "SPEC_ONLY_NOT_END_TO_END_VALIDATABLE"
    blocking_dependency: >-
      ORACLE-FULL cannot be end-to-end validated until a genuinely semantic target/arm such as a
      future `A3s-semantic-target` is separately designed, accepted, and implemented under its own
      Work Package.
    forbidden_under_this_package:
      - "implementing ORACLE-FULL"
      - "executing ORACLE-FULL"
      - "claiming ORACLE-FULL calibration or validation has occurred"
    explicit_statement: >-
      A future worker may not treat this section as authorization to implement or approximate
      ORACLE-FULL. It exists here only so a future worker does not attempt to "complete" it
      prematurely.

interpretation_boundaries:
  - "Oracle-tier success (either tier) proves channel usability, not normal reliance by an unedited trained model."
  - "Editability, directional precision, or dose-response results cannot be interpreted as evidence that the unedited representation has a human-factorized semantic coordinate system."
  - "Targeted editability does not imply normal trained-model reliance on the same coordinate for the same downstream purpose."
  - "Any future runtime edit intervention or trained-model execution is a separate SCIENTIFIC Work Package requiring its own accepted authority."
  - "ORACLE_CONTROL channel-usability semantics do not collapse into, and are not evidence for or against, TRAINED_STATE_EDIT targeted editability, directional precision, or dose-response."

null_invalid_and_censoring_states:
  intervention_class_aware: true
  precedence:
    - "INVALID_INTERVENTION_CLASS_UNSPECIFIED"
    - "INVALID_INTERVENTION_CLASS_MISMATCH"
    - "INVALID_CHECKPOINT_OR_RETRAINING"
    - "INVALID_ORACLE_FULL_ATTEMPTED"
    - "INVALID_ORACLE_TIER_UNSPECIFIED"
    - "INVALID_CONTEXT_MISMATCH"
    - "INVALID_TARGET_UNDECLARED"
    - "NOT_EVALUATED_NO_DOWNSTREAM_POSITION"
    - "NOT_EVALUATED_EDIT_NOT_APPLICABLE"
    - "NOT_EVALUATED_NO_MATCHED_PAIR"
    - "CENSORED_TERMINATED_BEFORE_PLANNED_EDIT"
    - "EVALUATED"
  states:
    INVALID_INTERVENTION_CLASS_UNSPECIFIED:
      endpoint: null
      trigger: "no intervention_class is declared, or the declared value is not one of TRAINED_STATE_EDIT / ORACLE_CONTROL"
    INVALID_INTERVENTION_CLASS_MISMATCH:
      endpoint: null
      trigger: >-
        a TRAINED_STATE_EDIT row declares an oracle_tier, or an ORACLE_CONTROL row is scored under
        targeted_editability / directional_edit_precision / edit_strength_dose_response; neither
        case is silently coerced into the other intervention class
    NOT_EVALUATED_NO_DOWNSTREAM_POSITION:
      endpoint: null
      trigger: "the reference trajectory has no downstream resolver position where an edit could act"
    NOT_EVALUATED_EDIT_NOT_APPLICABLE:
      endpoint: null
      trigger: "a downstream position exists but the declared edit cannot be constructed or applied there"
    NOT_EVALUATED_NO_MATCHED_PAIR:
      endpoint: null
      trigger: "directional scoring is requested but no matched non-concept-context counterfactual/pair is available"
    INVALID_CHECKPOINT_OR_RETRAINING:
      endpoint: null
      trigger: "same-checkpoint identity mismatch or prohibited retraining, consistent with the parent EVAL/audit rule"
    INVALID_CONTEXT_MISMATCH:
      endpoint: null
      trigger: "allowed non-concept context differs across the matched pair used for directional scoring"
    INVALID_TARGET_UNDECLARED:
      endpoint: null
      trigger: "the intended target action/policy consequence was not declared before the downstream decision was observed"
    INVALID_ORACLE_TIER_UNSPECIFIED:
      endpoint: null
      trigger: >-
        intervention_class == ORACLE_CONTROL and the row does not declare whether it is
        ORACLE-STRUCT or ORACLE-FULL. Does NOT apply to TRAINED_STATE_EDIT rows: those never
        declare an oracle tier and an absent tier there is not a trigger for this state.
      applies_only_to_intervention_class: "ORACLE_CONTROL"
    INVALID_ORACLE_FULL_ATTEMPTED:
      endpoint: null
      trigger: "a fixture or future result attempts to execute, approximate, or claim validation of ORACLE-FULL before A3s-semantic-target exists"
    CENSORED_TERMINATED_BEFORE_PLANNED_EDIT:
      endpoint: null
      trigger: "free-running generation terminated before the planned edit position"
      denominator_rule: "remains in the pre-edit reference opportunity accounting; never converted to a zero/no-effect result"
    EVALUATED:
      endpoint: "DEFINED"
      trigger: "all validity preconditions pass for the row's declared intervention_class"
      TRAINED_STATE_EDIT_semantics: >-
        both any_change and target_hit are defined; no oracle_tier is declared or required
      ORACLE_CONTROL_semantics: >-
        the declared oracle tier's channel-usability outcome is defined (ORACLE-FULL execution
        itself remains forbidden and is intercepted earlier by INVALID_ORACLE_FULL_ATTEMPTED)
  null_is_not_zero_effect: true

future_execution_binding:
  checkpoint_identity: >-
    Any future edit-precision execution must bind exact checkpoint identity and forbid retraining,
    consistent with the parent EVAL's checkpoint_and_provenance and the parent audit's
    same-checkpoint content-intervention rules. This audit does not itself define a new checkpoint.
  flops_and_parameter_matching: >-
    Any future execution inherits the frozen contract's parameter-count/FLOPs/context-matching
    requirements by reference. This audit does not define new numeric budgets, matching
    tolerances, or a new comparison arm.
  new_arm_authorization: "NOT_AUTHORIZED_BY_THIS_AUDIT"
  execution_work_package: "REQUIRES_SEPARATE_EXTERNAL_REVIEWER_AUTHORIZATION_AS_SCIENTIFIC"

