  - id: "ROME causal tracing"
    primary_source: "https://arxiv.org/abs/2202.05262"
    relevance: "causal tracing/intervention methodology"

calibration:
  current_status: "CALIBRATING_STATIC_ONLY"
  valid_for_real_model_inference: false
  valid_for_confirmatory_freeze: false
  reviewer_required: true

promotion_boundary:
  real_model_discovery: "SEPARATE_REVIEWER_AUTHORIZED_VERSIONED_WORK_PACKAGE_REQUIRED"
  confirmatory_freeze: "NOT_AUTHORIZED"
  thresholds_or_supported_refuted_decision: "FORBIDDEN"
  go_latent: "NOT EVALUATED"
