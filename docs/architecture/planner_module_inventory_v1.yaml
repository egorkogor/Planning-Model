schema_version: work-planner/1.20
contract_id: planner-module-inventory/1.0
implementation:
  framework: PyTorch
  state_dict_key_policy: exact names in tensors; wrappers/prefixes forbidden
  attention:
    projection_layout: separate_q_k_v_out
    projection_bias: false
    num_heads: 8
    head_dim: 32
    scale: 1/sqrt(32)
    softmax_accumulation_dtype: float32
    attention_probability_dropout: 0.0
  ffn:
    linear_bias: true
    activation: torch.nn.functional.gelu
    gelu_approximate: none
  layer_norm:
    eps: 1.0e-05
    elementwise_affine: true
    bias: true
  dropout:
    residual_dropout: selected_config.dropout
    ffn_activation_dropout: selected_config.dropout
    embedding_dropout: 0.0
  encoder:
    pre_norm: true
    final_norm: true
  decoder:
    pre_norm: true
    final_norm: true
    causal_self_attention: true
    cross_attention: true
  task_token_embedding:
    vocabulary_size: 40
    padding_idx: 0
  a1_token_embedding:
    vocabulary_size: 24
    padding_idx: 0
  bos_representation: separate concept_packer.bos_embedding parameter, not an action
    row
  previous_argument_projections: separate arg1 and arg2 bias-free Linear(256,256)
  pointer_score: decoder_state @ pointer_weight @ ref_hidden; no pointer bias
  signature_fields:
    intent_id: 7
    hand_mode: 2
    goal_relation: 3
    moving_clear: 3
    support_clear: 3
    obstruction_depth_bucket: 4
    remaining_distance_bucket: 5
