schema_version: work-planner/1.18
encoding_id: task-encoding/1.6
max_length: 192
surface_names_included: false
canonical_predicate_sort: lexicographic_by_symbol_then_argument_ref_rank
segments:
  SPECIAL: 0
  LEDGER: 1
  STATE: 2
  GOAL: 3
tokens:
  PAD: 0
  BOS: 1
  EOS: 2
  DOMAIN_BLOCKS: 3
  LEDGER: 4
  STATE: 5
  GOAL: 6
  PRED_OPEN: 7
  PRED_CLOSE: 8
  TYPE_BLOCK: 9
  'ON': 10
  ON_TABLE: 11
  CLEAR: 12
  HOLDING: 13
  HAND_EMPTY: 14
  REF_SLOT_0: 32
  REF_SLOT_1: 33
  REF_SLOT_2: 34
  REF_SLOT_3: 35
  REF_SLOT_4: 36
  REF_SLOT_5: 37
  REF_SLOT_6: 38
  REF_SLOT_7: 39
sequence_layout:
- BOS
- DOMAIN_BLOCKS
- LEDGER
- 'for_each_existing_ref_in_numeric_order: [REF_SLOT_i, TYPE_BLOCK]'
- STATE
- 'for_each_sorted_current_state_predicate: [PRED_OPEN, predicate_symbol, predicate_args_as_REF_SLOT, PRED_CLOSE]'
- GOAL
- 'for_each_sorted_goal_predicate: [PRED_OPEN, predicate_symbol, predicate_args_as_REF_SLOT, PRED_CLOSE]'
- EOS
- PAD_to_max_length
segment_assignment:
  BOS_DOMAIN_EOS_PAD: SPECIAL
  LEDGER_marker_and_entries: LEDGER
  STATE_marker_and_predicates: STATE
  GOAL_marker_and_predicates: GOAL
embeddings:
  sum:
  - token_embedding
  - absolute_position_embedding
  - segment_embedding
  - predicate_argument_position_embedding
  predicate_argument_position_values:
    outside_predicate: 0
    predicate_symbol: 1
    first_argument: 2
    second_argument: 3
ref_slot_output:
  H_ref_definition: final_encoder_state_at_ledger_REF_SLOT_i_position
  nonexistent_ref_slots: absent
  structural_pointer_mask: true
  domain_information_allowed_in_structural_mask: false
