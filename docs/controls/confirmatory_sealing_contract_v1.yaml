schema_version: work-planner/1.13
contract_id: confirmatory-sealing/1.3
roles:
  builder:
    may_read:
    - train
    - development
    - pilot
    may_read_confirmatory_task_bodies: false
    may_write_source_repository: true
  data_sealer:
    may_read:
    - locked_generator_contracts
    - locked_split_contract
    may_read_development_or_pilot_outcomes: false
    may_write_source_repository: false
    may_write_only:
    - encrypted_dataset_blob
    - sealer_logs
    - sealer_manifest
    must_destroy_plaintext_before_manifest_release: true
    secret_seed_generation: CSPRNG_256_BIT_INSIDE_SEALER_ENVIRONMENT
    seed_plaintext_export: forbidden
    stage1b_hidden_certification_required: true
    stage1b_hidden_certification_inputs:
    - locked intent_control_contract
    - locked semantic_resolver_contract
    - locked support_eligibility_contract
    - locked public_exclusion_manifest
    stage1b_hidden_certification_outputs:
    - signed coverage manifest hash
    - signed support audit hash
    - eligible candidate count
    - coverage_rate=1.0
  evaluator:
    may_read_confirmatory_task_bodies: true
    may_write_source_repository: false
    may_write_only:
    - results
    - evaluator_logs
    - signed_result_manifest
  auditor:
    may_read:
    - contracts
    - freezes
    - raw_results
    - logs
    may_write_source_repository: false
sealed_dataset:
  format: age_or_equivalent_authenticated_encryption
  plaintext_location_on_builder: impossible_by_role_boundary
  builder_visible_fields:
  - encrypted_blob_sha256
  - task_count
  - strata_counts
  - canonical_order_commitment
  - generator_seed_commitment
  - sealer_identity_hash
  - plaintext_deletion_attestation
  - auditor_seed_envelope_sha256
  - auditor_seed_envelope_artifact
  - control_certification
  key_storage: evaluator_only_secret_store
  decrypt_only_after:
  - approved_freeze_pointer_exists
  - freeze_hash_matches
  - evaluator_environment_lock_matches
  generation_role: data_sealer
  seed_commitment_formula: sha256(seed_bytes || UTF8(run_id) || UTF8(stage))
  seed_envelope: encrypted_to_AUDITOR_public_key; plaintext reveal only after signed evaluator result manifest exists
  task_count_rule: signed sealer task_count == freeze sample_size == locked sample-size selected_n; strata_counts sum exactly
    to task_count
execution:
  evaluator_clean_checkout_required: true
  evaluator_git_commit_must_equal_freeze: true
  network_access_during_confirmatory: disabled_except_artifact_upload
  stdout_must_not_print_task_bodies: true
  result_manifest_signed_by_evaluator: true
  signed_lineage_chain:
  - builder SEAL_DATASET dispatch
  - signed sealer manifest
  - experiment freeze candidate
  - externally signed operator DecisionRecord
  - ApprovedFreezePointer
  - builder RUN_CONFIRMATORY dispatch
  - signed evaluator result manifest with exact raw path/hash map
fallback:
  single_agent_or_unsealed_execution: INVALID_CONFIRMATORY_BLINDNESS
sealer_protocol:
  input_dispatch_record_required: true
  deterministic_generation_from_locked_seed: false
  encrypt_before_any_transfer: true
  plaintext_deletion_verification:
  - file_absent
  - temporary_volume_destroyed
  - process_exit_clean
  output_schema: docs/schemas/sealer_manifest.schema.json
  failure_action: INVALID_CONFIRMATORY_BLINDNESS
  secret_seed_generated_by_sealer: true
  hidden_ranking: HMAC-SHA256(secret_seed, canonical_base_task_hash)
  public_exclusion_manifest_required: true
  seed_reveal_policy: AUDITOR_AFTER_SIGNED_EVALUATOR_RESULT
  stage1b_hidden_control_certification:
    owner: DATA_SEALER
    timing: after hidden candidate generation and before encryption release or any outcome access
    candidate_scope: every hidden Stage1B candidate task in reserve after public exclusions
    checks:
    - enumerate every reachable non-goal state under locked domain for each candidate
    - certify at least one locked incompatible control intent for every reachable state-goal pair
    - certify planner support signature eligibility under locked support contract
    - exclude ineligible candidates before hidden HMAC ranking; post-outcome exclusion forbidden
    required_coverage_rate: 1.0
    signed_manifest_field: control_certification
    builder_may_receive_task_ids_or_plaintext: false
    failure_action: BLOCKED_SUPPORT
  signed_dispatch_lineage_required: true
  manifest_dispatch_fields:
  - dispatch_id
  - dispatch_hash
cryptographic_attestation:
  algorithm: ed25519
  public_key_registry: locks/public-keys.json
  signed_payload: canonical JSON excluding signature and manifest_hash
  manifest_hash: sha256 of the same canonical unsigned payload
  verification: mandatory before gate acceptance
plaintext_deletion_evidence:
  required_fields:
  - workspace_scan_artifact
  - workspace_scan_sha256
  - process_log_artifact
  - process_log_sha256
  - volume_destroy_artifact
  - volume_destroy_sha256
  - encrypted_blob_closed_before_scan
  - plaintext_path_absent
  - temporary_volume_destroyed
  - attested_at
  artifact_hashes_must_be_present_in_phase_evidence: true
  trusted_boolean_without_evidence: forbidden
  signature_required: true
  seed_envelope_artifact_hash_must_be_present_in_phase_evidence: true
