schema_version: work-planner/1.21
control_id: intent-control/1.7
intent_block_attended_tokens: 32
compatibility:
  oracle: normative BFS
  definition:
  - compute all shortest first TypedActions
  - label each shortest first action with frozen intent labeler
  - compatible intents are unique labels
  wrong_intent_requirement:
  - selected intent not in compatible intents
  - selected intent differs from target oracle intent
selection:
  seed_payload_fields:
  - state_hash
  - goal_hash
  - stage
  - split
  - catalog_hash
  - control_contract_hash
  digest: sha256
  start_index: first_8_digest_bytes_as_big_endian_uint64_mod_7
  scan: cyclic_ascending_intent_id
  no_candidate_policy: CONTROL_UNAVAILABLE
pre_outcome_certification:
  stage1a: certify every frozen snapshot before any LLM call
  snapshot_policy: if a frozen Stage1A snapshot lacks a deterministic incompatible
    intent, exclude that snapshot from every Stage1A arm before outcomes are generated
  coverage_manifest_required: true
  manifest_frozen_before_confirmatory: true
  post_outcome_exclusion_forbidden: true
  stage1b_reachable_state_enumeration: forbidden and not part of v1.21 selection or
    control semantics
mapping_hash_payload:
- state_hash
- goal_hash
- selected_intent_id
- catalog_hash
- control_contract_hash
causal_interpretation: incompatibility is a semantic control; it does not guarantee
  the LLM action makes no oracle progress. E2/I2 equivalence to neutral is tested
  empirically.
scope:
  stage: STAGE1A_INTERFACE
  unit: frozen oracle snapshot
  stage1b_use: forbidden; Stage1B uses full_plan_shuffle_contract_v1.yaml and task-only
    selection
