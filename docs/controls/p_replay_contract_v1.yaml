schema_version: work-planner/1.20
contract_id: full-plan-replay/1.1
purpose: Measure exact deterministic execution of one precomputed frozen WorkPlan without LLM mediation or replanning.
shared_invariants:
  plan_generation_before_execution: required
  planner_calls_during_execution: 0
  plan_patch_or_regeneration: forbidden
  consume_positions: strictly_sequential_from_zero
  maximum_executed_actions: 16
  validate_before_execute: true
  check_goal_before_loop_and_after_each_action: true
  llm_calls: 0
  recovery: forbidden
  failed_plan_manifest_policy: paired_failure_with_zero_executor_calls
contexts:
  PLANNER_CONFIRMATORY_A3:
    phase: P08
    source_arm: PLANNER_A3_RAW
    source_plan: precomputed A3 WorkPlan from the same Planner confirmatory task, seed and checkpoint
    metric_name: P_REPLAY_GOAL_SUCCESS
    role: Stage1B eligibility diagnostic available before P09
  STAGE1B_E1:
    phase: P17
    source_arm: E1_A3_FULL_PLAN_RAW
    source_plan: exact E1 WorkPlan generated once before Stage1B execution
    metric_name: STAGE1B_E1_FULL_PLAN_REPLAY_GOAL_SUCCESS
    role: end-to-end diagnostic only; never substitutes for a core GO gate
lineage:
  episode_plan_manifest_required: true
  source_manifest_sha256_required: true
  work_plan_content_sha256_required: true
  work_plan_artifact_sha256_required: true
  attempt_plan_position_required: true
  exact_typed_action_match_required: true
  implementation_lock_hash_required: true
change_after_scientific_lock: forbidden
