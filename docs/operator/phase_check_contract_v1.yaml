runtime_checker:
  module: src.validation.phase_checks
  command_template: python -m src.validation.phase_checks --phase {phase_id} --check {check_id} --phase-report reports/phase-{phase_id}.json
  stdout_schema: docs/schemas/machine_check_result.schema.json
  missing_module_action: BLOCKED_MISSING_RUNTIME_CHECKER
  nonzero_exit_action: BLOCKED_FAILED_MACHINE_CHECK
rules:
  every_pre_or_execution_check_has_locked_verifier: true
  post_gate_checks_are_recomputed_inside_verify_gate: true
  runtime_check_must_return_exact_phase_and_check_id: true
  runtime_check_status_must_be_PASS: true
  runtime_checker_source_enters_implementation_lock: true
  phase_report_check_status_is_not_trusted_without_rerun: true
  builder_runtime_checker_is_not_independent_evidence: true
  confirmatory_dispatch_requires_both_G06_signed_audits: true
