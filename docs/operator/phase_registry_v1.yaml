- phase_id: P07
  title: Planner development, pilot, N и freeze
  approval_mode: manual
  manual_gate_id: G07_PLANNER_CONFIRMATORY_FREEZE
  actions:
  - выполнить bounded hyperparameter grid на development
  - train six variants × five final seeds plus A2c/A3 FLOPs-sensitivity × five seeds;
    emit 30 final and 10 sensitivity reports with verified sidecars
  - рассчитать pilot N and freeze analysis
  - dispatch locked contracts and public-exclusion manifest to Data Sealer; Data Sealer
    generates a hidden 256-bit seed, returns only seed commitment, encrypted blob
    hash and signed sealer manifest; create candidate freeze
  - after external approval, create ApprovedFreezePointer and immutable evaluator
    dispatch linked to the signed decision
  - Data Sealer must emit an exact selected-task manifest before outcomes and bind
    its path, SHA-256 and task_count in the signed sealer manifest
  - validate exact initialization tensor values against the locked name-derived PCG64
    algorithm
  - reject final checkpoints with no changed active tensor, changed dormant tensors,
    NaN/Inf, or all-zero AdamW state; verify locked optimizer metadata
  required_outputs:
  - reports/planner-pilot.json
  - reports/training/final/
  - reports/training/flops-sensitivity/
  - reports/training/checkpoints/
  - reports/sample-size-planner.json
  - checkpoints/planner-seeds/manifest.json
  - freezes/planner-confirmatory.candidate.json
  - dispatch/sealer-planner.json
  - sealed/planner-confirmatory/selected-task-manifest.json
  - sealed/planner-confirmatory/sealer-manifest.json
  - reports/self-review-P07.json
  - reports/phase-P07.json
  - RUN_STATUS.md
  - RUN_STATUS.json
  pre_gate_checks:
