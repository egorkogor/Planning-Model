- phase_id: P06
  title: Planner implementations, independent implementation/statistics audits и Implementation
    lock
  approval_mode: manual
  manual_gate_id: G06_STATISTICAL_IMPLEMENTATION_AUDIT
  actions:
  - finish six trainable Planner variants A1/A2/A2b/A2c/A3/A3r, A4/A5 inference interventions
    and all outcome-relevant runtime modules required through P17
  - materialize exact state_dict inventory, seed-17 initialization checkpoint and
    six variant-specific dormant-gradient audits under reports/model-evidence before
    issuing model-audit PASS
  - prove P10 prototype-bank/parser path and P15 graph/control-certification path
    execute on toy/public fixtures
  - run full toy preflight from clean checkout
  - create implementation commit containing every protected executable path
  - obtain signed independent statistical audit and signed independent implementation
    audit of the same commit
  - create implementation-lock candidate binding both audits, Scientific lock, Trust
    Topology lock and reviewed commit
  - after G06 approval create and verify active Implementation lock; no later source
    implementation is permitted
  - 'materialize check-specific P06 evidence: exact parameter inventory counts, at
    at least 21 normative SAME_INFORMATION cases with at least three cases per intent_id recomputed by intent_labeler, exactly 36 RAW_ROLLOUT cases covering six trainable variants by six non-terminal intents with bound logits/plan/event files and no mask/replanning, and six seed-17 dormant-gradient
    audits'
  - model-audit recomputed_value is produced by validator code; Builder-submitted
    booleans are not authoritative
