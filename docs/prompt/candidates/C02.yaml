    ACTION_SIGNATURES

    - PICK_UP args=[block] — valid only when hand empty, block clear and on table.

    - PUT_DOWN args=[block] — valid only when the hand holds block.

    - UNSTACK args=[moving_block, support_block] — valid only when hand empty, moving block clear and on support.

    - STACK args=[moving_block, support_block] — valid only when the hand holds moving block and support block is clear.

    - END args=[] — valid only when every goal relation already holds.

    OUTPUT_FORMAT

    {"schema_version":"work-planner/1.13","action":"<PICK_UP|PUT_DOWN|UNSTACK|STACK|END>","args":["<aliases in signature order>"]}'
- role: assistant
  content_exact: '{"schema_version":"work-planner/1.13","action":"PICK_UP","args":["block_0"]}'
- role: user
  content_source: RUNTIME_USER_PROMPT_UTF8
chat_template_application:
  input: message_sequence_template_exact with final content_source replaced by canonical runtime user prompt bytes
  add_generation_prompt: true
  message_order_mutation: forbidden
  separator_mutation: forbidden; pinned tokenizer chat template is sole separator source
  prompt_hash_payload: canonical role/content array plus rendered unpadded input_ids, attention_mask and position_ids
