  content_exact: You select exactly one next valid BlocksWorld action. Return exactly one JSON object and no other text.
- role: user
  content_exact: 'TASK

    Select exactly one next valid BlocksWorld action.

    AVAILABLE_BLOCKS

    block_0

    CURRENT_STATE

    block_0 is clear

    block_0 is on the table

    the hand is empty

    GOAL

    block_0 must be on the table

    GUIDANCE_BLOCK

    GUIDANCE: the goal is already satisfied, so finish without moving a block

    ACTION_SIGNATURES

    - PICK_UP args=[block] — valid only when hand empty, block clear and on table.

    - PUT_DOWN args=[block] — valid only when the hand holds block.

    - UNSTACK args=[moving_block, support_block] — valid only when hand empty, moving block clear and on support.

    - STACK args=[moving_block, support_block] — valid only when the hand holds moving block and support block is clear.

    - END args=[] — valid only when every goal relation already holds.

    OUTPUT_FORMAT

    {"schema_version":"work-planner/1.13","action":"<PICK_UP|PUT_DOWN|UNSTACK|STACK|END>","args":["<aliases in signature order>"]}'
- role: assistant
  content_exact: '{"schema_version":"work-planner/1.13","action":"END","args":[]}'
- role: user
  content_exact: 'TASK

    Select exactly one next valid BlocksWorld action.

    AVAILABLE_BLOCKS

    block_0

    block_1

    CURRENT_STATE

    block_0 is clear

    block_0 is on the table

