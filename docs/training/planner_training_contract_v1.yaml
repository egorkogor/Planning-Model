schema_version: work-planner/1.20
contract_id: planner-training/1.1
precision:
  parameters: float32
  mixed_precision_gpu: bfloat16
  gradients: float32
optimizer:
  name: AdamW
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  safetensors_metadata_required:
    optimizer: AdamW
    beta1: '0.9'
    beta2: '0.95'
    eps: 1e-08
    weight_decay: '0.01'
schedule:
  type: linear_warmup_cosine_decay
  warmup_fraction: 0.05
  min_lr_fraction: 0.1
training:
  development:
    max_epochs: 20
    early_stopping_patience_epochs: 3
    minimum_epochs: 5
    batch_size_examples: 128
    gradient_accumulation_steps: 1
    validation_every_optimizer_steps: 500
    checkpoint_every_optimizer_steps: 1000
    keep_best_and_last: true
    retained_checkpoint_count_exact: 2
  final_confirmatory_models:
    optimizer_updates_exact: 12000
    early_stopping: forbidden
    same_ordered_training_examples_per_seed_across_arms: true
    same_batch_size: 128
    same_gradient_accumulation_steps: 1
    checkpoint_every_optimizer_steps: 1000
    same_parameter_inventory_hash: true
    unused_module_gradient_policy: grad must remain None; any nonzero or zero-materialized
      gradient is INVALID_RUN
    final_checkpoint_optimizer_step_exact: 12000
    intermediate_checkpoint_selection: forbidden
    selected_development_config_shared_across_A1_A2_A2b_A2c_A3_A3r: true
    retained_checkpoint_count_exact: 1
    intermediate_checkpoint_retention_after_completion: forbidden
    variants_exact:
    - A1
    - A2
    - A2b
    - A2c
    - A3
    - A3r
    training_report_directory: reports/training/final
    training_report_count_exact: 30
    checkpoint_selection: FINAL_STEP_ONLY
    sidecar_evidence:
      selected_config: reports/training/selected-config.json
      parameter_inventory: reports/model-evidence/parameter-inventory.json
      initialization_manifests: reports/training/initialization/seed-{seed}.json
      ordered_examples: reports/training/ordered-examples/seed-{seed}.json
      dormant_gradient_audits: reports/training/dormant-gradients/{variant}-seed-{seed}.json
      checkpoint_manifests: reports/training/checkpoints/final-{variant}-seed-{seed}.json
  common:
    shuffle: deterministic_by_seed
    fail_on_nan_or_inf: true
  flops_sensitivity_models:
    variants_exact:
    - A2c
    - A3
    seeds_exact:
    - 101
    - 202
    - 303
    - 404
    - 505
    report_directory: reports/training/flops-sensitivity
    report_count_exact: 10
    checkpoint_manifest_pattern: reports/training/checkpoints/flops-{variant}-seed-{seed}.json
    optimizer_updates_source: reports/compute-profile.json#flops_matched_schedule.optimizer_updates_by_variant
    checkpoint_selection: FLOPS_CAP_STEP
    same_selected_config_dataset_order_and_initialization_as_final_models: true
losses:
  common:
    action_ce: 1.0
    arg1_pointer_ce: 1.0
    arg2_pointer_ce: 1.0
  A2b:
    intent_ce: 0.5
  A2c:
    signature_field_ce_total: 0.5
    field_weights_equal: true
    per_field_weight: 0.5 / 7
  A3:
    cosine: 0.25
    supervised_multi_positive_contrastive: 0.25
    contrastive_temperature: 0.07
    contrastive_positive_key: exact_full_semantic_signature
    same_intent_different_signature_as_positive: forbidden
  A3r:
    cosine: 0.25
    supervised_multi_positive_contrastive: 0.25
    contrastive_temperature: 0.07
    contrastive_positive_key: exact_full_semantic_signature
    same_intent_different_signature_as_positive: forbidden
    target_source: semantic_bank/random-codebook/manifest.json
    codebook_frozen_before_training: true
  masking:
    action_ce: all non-padding typed-step positions, including terminal END
    arg1_pointer_ce: PICK_UP, PUT_DOWN, UNSTACK, STACK positions only
    arg2_pointer_ce: UNSTACK and STACK positions only
    semantic_auxiliary_losses: non-END positions only and only for the active arm-specific
      semantic head
    A1_token_grammar_ce: all non-padding grammar-token positions, including ACTION_END
      and PLAN_END
  reduction:
    per_head: mean over valid targets for that head
    total: weighted sum of active per-head means
    head_with_zero_valid_targets: exact zero loss with no gradient materialized for
      that head
    padding: excluded from every numerator and denominator
  contrastive_edge_case:
    eligible_anchor: anchor has at least one other batch item with the exact full
      semantic signature
    anchor_without_positive: excluded from contrastive loss
    batch_without_eligible_anchors: contrastive loss is exact zero with no gradient
  A1:
    token_grammar_ce: 1.0
  active_heads_by_trainable_arm:
    A1:
    - token_grammar_ce
    A2:
    - action_ce
    - arg1_pointer_ce
    - arg2_pointer_ce
    A2b:
    - action_ce
    - arg1_pointer_ce
    - arg2_pointer_ce
    - intent_ce
    A2c:
    - action_ce
    - arg1_pointer_ce
    - arg2_pointer_ce
    - signature_field_ce_total
    A3:
    - action_ce
    - arg1_pointer_ce
    - arg2_pointer_ce
    - cosine
    - supervised_multi_positive_contrastive
    A3r:
    - action_ce
    - arg1_pointer_ce
    - arg2_pointer_ce
    - cosine
    - supervised_multi_positive_contrastive
  inactive_head_policy: not evaluated, absent from total loss, and parameters retain
    grad None
teacher_forcing:
  development_and_final_training: full_ground_truth_previous_step
  scheduled_sampling: forbidden
raw_rollout:
  domain_action_mask_before_raw_log: forbidden
  structural_padding_mask: required
  max_non_end_actions: 16
  terminal_end_position: 17
compute_comparisons:
  primary:
    name: equal_data_equal_updates
    same_examples: true
    same_ordered_examples: true
    same_batch_size: true
    same_optimizer_updates_exact: 12000
    early_stopping_in_final_training: forbidden
  sensitivity:
    name: measured_train_flops_matched
    tolerance_fraction: 0.02
    method: truncate_higher_flop_arm_at_precomputed_optimizer_step
    comparison_variants:
    - A3
    - A2c
    cap_rule: min(measured A3 step FLOPs, measured A2c step FLOPs) * 12000
    separate_models_per_final_seed: true
    maximum_optimizer_updates: 12000
  decision_requires_same_effect_direction: true
final_seeds:
- 101
- 202
- 303
- 404
- 505
development_seed: 17
ablation_training_policy:
  A4: no_training; exact A3 checkpoint; execute exact A3 latent projection and normalization,
    then replace projected 256-vector with zeros before ConceptPacker sum; same FLOPs
    path
  A5: no_training; exact A3 checkpoint; use frozen planner latent ablation manifest
  weights_sha256_must_equal_A3: true
  only_allowed_difference: semantic_feedback_intervention_manifest
hyperparameter_selection_policy:
  grid_shared_across_arms: true
  selection_unit: config_id
  per_arm_validation_composite: 0.70*goal_success + 0.20*valid_action_rate + 0.10*exact_plan_match
  arms_ranked:
  - A1
  - A2
  - A2b
  - A2c
  - A3
  - A3r
  primary_score: mean_rank_of_per_arm_validation_composite; lower_is_better
  ranking_tie_policy: average_rank_for_exact_ties
  eligibility_floors:
    all_arms_minimum_valid_action_rate: 0.9
    A3_minimum_goal_success: 0.5
    A3r_minimum_goal_success: 0.1
  tie_breaks:
  - higher_A3_validation_composite
  - lower_mean_train_flops_across_A1_A2_A2b_A2c_A3_A3r
  - lexicographically_lower_config_id
  selected_once_before_final_seeds: true
  source_of_truth: docs/training/hyperparameter_search_v1.yaml
random_code_control:
  variant: A3r
  contract: docs/controls/random_codebook_contract_v1.yaml
  same_architecture_as_A3: true
  same_training_examples_and_updates_as_A3: true
  only_target_change: frozen random code per exact semantic signature
initialization:
  contract: docs/training/planner_initialization_contract_v1.yaml
  common_superset_checkpoint_once_per_seed: true
  same_initialization_checkpoint_across_A1_A2_A2b_A2c_A3_A3r: true
  parameter_name_derived_tensor_seeds: true
evidence_validation:
  checkpoint_format: SAFETENSORS
  checkpoint_header_must_exactly_match_locked_inventory: true
  optimizer_state_format: SAFETENSORS_ADAMW
  optimizer_state_must_cover_exact_active_parameter_set: true
  sidecar_content_is_recomputed_not_trusted: true
  P06_model_audit_seed: 17
  P06_required_model_evidence: exact inventory + initialization checkpoint + six dormant-gradient
    audits
confirmatory_checkpoint_binding:
  lineage_record_fields:
  - checkpoint_manifest
  - checkpoint_manifest_sha256
  primary_arms: FINAL_EQUAL_DATA checkpoint of matching variant and seed
  A4_A5: FINAL_EQUAL_DATA A3 checkpoint of matching seed
  PLANNER_A2C_FLOPS_RAW: FLOPS_SENSITIVITY A2c checkpoint of matching seed
  PLANNER_A3_FLOPS_RAW: FLOPS_SENSITIVITY A3 checkpoint of matching seed
  P_FULL_PLAN_REPLAY_RAW: same FINAL_EQUAL_DATA A3 checkpoint as source PLANNER_A3_RAW
  required_hash_chain: lineage record -> checkpoint manifest -> model_file_sha256
    -> EpisodePlanManifest/WorkPlan
  mismatch_action: INVALID_CONFIRMATORY
evidence:
  initialization_values_recomputed_from_locked_PCG64_algorithm: true
  final_checkpoint_active_tensor_change_required: true
  dormant_tensor_byte_identity_to_initialization_required: true
  optimizer_state_finite_nonzero_and_locked_metadata_required: true
  P08_checkpoint_binding: canonical P07 training report and checkpoint manifest paths
    only; arbitrary link manifests forbidden
