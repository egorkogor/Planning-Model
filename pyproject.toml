[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "planner-llm-mvp-stage1"
version = "0.8.0"
description = "Autonomous Work Planner/BlocksWorld experiment playbook and harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<20",
  "scipy>=1.14,<2",
  "cryptography>=44,<47",
]

[project.optional-dependencies]
ml = [
  "torch==2.12.0+cpu",
  "PyYAML==6.0.3",
]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "jsonschema>=4.23,<5",
  "referencing>=0.35,<1",
  "PyYAML>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/planner_llm_mvp", "planner_toy", "scripts"]

[tool.hatch.build.targets.wheel.force-include]
"docs/architecture/planner_module_inventory_v1.yaml" = "planner_toy/planner_module_inventory_v1.yaml"

[tool.pytest.ini_options]
addopts = "-q -m 'not canonical_quality'"
testpaths = ["tests", "validation"]
pythonpath = ["src"]
markers = [
  "canonical_quality: full pinned-runtime cross-process canonical diagnostic",
]

[tool.ruff]
exclude = ["validation"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
