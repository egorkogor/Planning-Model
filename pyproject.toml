[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "planner-llm-mvp-stage1"
version = "0.7.0"
description = "Autonomous Work Planner/BlocksWorld experiment playbook and harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<20",
  "scipy>=1.14,<2",
  "cryptography>=44,<47",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "jsonschema>=4.23,<5",
  "referencing>=0.35,<1",
  "PyYAML>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/planner_llm_mvp"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests", "validation"]
pythonpath = ["src"]

[tool.ruff]
exclude = ["validation"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
